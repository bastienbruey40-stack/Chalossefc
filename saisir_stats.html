<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Saisir les Stats - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container narrow">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Stats du match</h1>
            <p>Buts, passes décisives et cartons des joueurs de la compo.</p>
        </header>

        <div class="card">
            <div class="onglets" role="tablist" id="filtre-equipe" style="margin-bottom: 14px;">
                <button type="button" class="btn-onglet actif" data-eq="toutes">Toutes les équipes</button>
                <button type="button" class="btn-onglet" data-eq="premiere">🔵 Première</button>
                <button type="button" class="btn-onglet" data-eq="reserve">🟢 Réserve</button>
            </div>

            <label style="margin-top:0">Match à renseigner</label>
            <div id="picker-match"></div>
        </div>

        <div class="card stats-saisie hidden" id="carte-effectif">
            <div class="toolbar-row" style="margin-bottom: 10px;">
                <strong style="font-size: .95rem;">Feuille de statistiques</strong>
                <button type="button" class="btn-chip" id="btn-effacer-match" style="color: var(--rouge);">🗑️ Effacer les stats de ce match</button>
            </div>
            <div id="liste-effectif"></div>
        </div>

        <div class="sticky-actions hidden" id="barre-save">
            <button class="btn" id="btn-save" style="background:var(--violet); color:#fff">💾 Enregistrer les stats</button>
        </div>
    </main>

    <script type="module">
        import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil, lireCollection, lireDoc, invaliderCache } from "./js/firebase.js";
        import { toast, flash, confirmer, chargement, echapper, formaterDate, creerSelectCustom } from "./js/ui.js";
        import { trierParDate, estJoue } from "./js/matchs.js";

        let tousLesMatchs = [];
        let filtreEquipe = 'toutes';
        let matchActifId = '';

        const selectMatch = creerSelectCustom('picker-match', {
            placeholder: 'Choisir un match…',
            iconePlaceholder: '📝',
            onChange: (id) => {
                matchActifId = id;
                chargerJoueursMatch(id);
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }
            const profil = await chargerProfil(user.uid).catch(() => null);
            if (profil?.role === "admin") chargerMatchs();
            else {
                flash("Accès réservé aux administrateurs.", 'error');
                window.location.href = "index.html";
            }
        });

        async function chargerMatchs() {
            const items = await lireCollection("matchs");
            tousLesMatchs = [...items];
            trierParDate(tousLesMatchs).reverse(); // plus récents en premier
            majOptionsMatchs();
        }

        function majOptionsMatchs() {
            const filtres = tousLesMatchs.filter(m =>
                filtreEquipe === 'toutes' || (m.data.equipe_type === 'premiere' ? 'premiere' : 'reserve') === filtreEquipe
            );
            const options = filtres.map(({ id, data }) => {
                const eq = data.equipe_type === 'premiere' ? 'premiere' : 'reserve';
                const labelEq = eq === 'premiere' ? 'Première' : 'Réserve';
                const aDesStats = data.stats_joueurs && Object.keys(data.stats_joueurs).length > 0;
                const scoreTxt = estJoue(data) ? `${data.score_chalosse} - ${data.score_adversaire}` : (aDesStats ? 'Stats saisies' : 'À saisir');
                return {
                    value: id,
                    dot: eq,
                    label: `${data.adversaire || 'Adversaire'}`,
                    sub: `${labelEq} · ${formaterDate(data.date)}`,
                    badge: scoreTxt,
                    badgeClass: aDesStats || estJoue(data) ? 'ok' : ''
                };
            });
            selectMatch.setOptions(options, false);
            matchActifId = '';
            document.getElementById('carte-effectif').classList.add('hidden');
            document.getElementById('barre-save').classList.add('hidden');
        }

        document.querySelectorAll('#filtre-equipe [data-eq]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#filtre-equipe [data-eq]').forEach(b => b.classList.toggle('actif', b === btn));
                filtreEquipe = btn.dataset.eq;
                majOptionsMatchs();
            });
        });

        async function chargerJoueursMatch(matchId) {
            const conteneur = document.getElementById('liste-effectif');
            const carte = document.getElementById('carte-effectif');
            const barre = document.getElementById('barre-save');

            if (!matchId) { carte.classList.add('hidden'); barre.classList.add('hidden'); return; }
            carte.classList.remove('hidden');
            conteneur.innerHTML = `<div class="skeleton small"></div><div class="skeleton small"></div>`;

            const [matchRes, usersItems] = await Promise.all([
                lireDoc("matchs", matchId),
                lireCollection("utilisateurs")
            ]);
            const matchData = matchRes ? matchRes.data : {};
            const compo = matchData.compo || [];
            const statsExistantes = matchData.stats_joueurs || {};

            if (compo.length === 0) {
                conteneur.innerHTML = `<p class="error-text" style="margin:0">⚠️ Aucune compo faite pour ce match. <a href="gerer_compo.html">Faire la compo</a></p>`;
                barre.classList.add('hidden');
                return;
            }

            let html = "";
            usersItems.forEach(({ id: jId, data: jData }) => {
                if (!compo.includes(jId)) return;
                const s = statsExistantes[jId] || {};
                html += `
                    <div class="joueur-ligne" data-id="${jId}">
                        <span class="joueur-nom">${echapper(jData.prenom)} ${echapper(jData.nom)}</span>
                        <div class="inputs-stats">
                            <div><label title="Buts">⚽</label><input type="number" inputmode="numeric" min="0" class="in-buts" value="${s.buts || 0}"></div>
                            <div><label title="Passes décisives">🎯</label><input type="number" inputmode="numeric" min="0" class="in-passes" value="${s.passes || 0}"></div>
                            <div><label title="Cartons jaunes">🟨</label><input type="number" inputmode="numeric" min="0" max="2" class="in-jaunes" value="${s.jaunes || 0}"></div>
                            <div><label title="Cartons rouges">🟥</label><input type="number" inputmode="numeric" min="0" max="1" class="in-rouges" value="${s.rouges || 0}"></div>
                        </div>
                    </div>`;
            });
            conteneur.innerHTML = html;
            barre.classList.remove('hidden');
        }

        // Sélectionne tout le contenu au toucher pour remplacer "0" rapidement
        document.getElementById('liste-effectif').addEventListener('focusin', (e) => {
            if (e.target.matches('input')) e.target.select();
        });

        // Effacer toutes les stats du match sélectionné
        document.getElementById('btn-effacer-match').addEventListener('click', async () => {
            if (!matchActifId) return;
            const ok = await confirmer(
                "Voulez-vous remettre à zéro et supprimer toutes les statistiques (buts, passes, cartons) enregistrées pour ce match ?",
                { titre: 'Supprimer les stats de ce match ?', ok: 'Supprimer les stats', danger: true }
            );
            if (!ok) return;
            try {
                await updateDoc(doc(db, "matchs", matchActifId), { stats_joueurs: {} });
                invaliderCache("matchs");
                document.querySelectorAll('#liste-effectif input').forEach(inp => { inp.value = 0; });
                toast("Statistiques du match supprimées.");
            } catch (err) {
                toast("Erreur : " + err.message, 'error');
            }
        });

        document.getElementById('btn-save').addEventListener('click', async () => {
            if (!matchActifId) return;
            const stats_joueurs = {};
            document.querySelectorAll('#liste-effectif .joueur-ligne').forEach(ligne => {
                stats_joueurs[ligne.dataset.id] = {
                    buts: parseInt(ligne.querySelector('.in-buts').value) || 0,
                    passes: parseInt(ligne.querySelector('.in-passes').value) || 0,
                    jaunes: parseInt(ligne.querySelector('.in-jaunes').value) || 0,
                    rouges: parseInt(ligne.querySelector('.in-rouges').value) || 0
                };
            });

            const bouton = document.getElementById('btn-save');
            chargement(bouton, true);
            try {
                await updateDoc(doc(db, "matchs", matchActifId), { stats_joueurs: stats_joueurs });
                invaliderCache("matchs");
                flash("Stats enregistrées !");
                window.location.href = "stats.html";
            } catch (e) {
                toast("Erreur : " + e.message, 'error');
                chargement(bouton, false);
            }
        });
    </script>
</body>
</html>
