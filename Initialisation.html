<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0d">
    <title>Initialisation - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <img src="chalosse.webp" alt="Logo FC Chalosse" class="auth-logo">
        <h1>⚽ Initialisation Firebase</h1>
        <p class="muted">Création des collections et des premières données de démonstration.</p>

        <div id="status" class="muted" style="margin: 16px 0; font-weight: 600;">Prêt à initialiser.</div>

        <button class="btn" id="btn-init" type="button">Lancer l'initialisation</button>
        <a href="index.html" class="btn-retour">Retour à l'accueil</a>
    </div>

    <script type="module">
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil } from "./js/firebase.js";
        import { toast, flash, chargement, echapper } from "./js/ui.js";

        const statusDiv = document.getElementById('status');
        const btnInit = document.getElementById('btn-init');
        btnInit.disabled = true;

        // Sécurité : réservé exclusivement aux administrateurs connectés
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "connexion.html";
                return;
            }
            const profil = await chargerProfil(user.uid).catch(() => null);
            if (profil?.role !== "admin") {
                flash("Accès refusé : page réservée aux administrateurs.", "error");
                window.location.href = "index.html";
                return;
            }
            btnInit.disabled = false;
        });

        btnInit.addEventListener('click', async () => {
            chargement(btnInit, true, 'Initialisation en cours…');
            statusDiv.textContent = "Création des documents dans Firestore…";
            try {
                // 1. SAISONS
                const saisonRef = await addDoc(collection(db, "saisons"), { nom: "2023-2024" });

                // 2. UTILISATEURS
                const joueurRef = await addDoc(collection(db, "utilisateurs"), {
                    nom: "Bastiat",
                    prenom: "Bastien",
                    role: "joueur",
                    poste: "Gardien"
                });

                // 3. MATCHS
                const matchRef = await addDoc(collection(db, "matchs"), {
                    equipe_type: "premiere",
                    adversaire: "FC Doazit",
                    date: "2024-05-13",
                    saison_id: saisonRef.id,
                    compo: [joueurRef.id]
                });

                // 4. NOTES (Une note de test)
                await addDoc(collection(db, "notes"), {
                    joueur_id: joueurRef.id,
                    match_id: matchRef.id,
                    note: 8,
                    commentaire: "Clean sheet et bel arrêt réflexe !"
                });

                statusDiv.innerHTML = "<span style='color:var(--vert)'>✅ Base FOOTBALL initialisée avec succès !</span>";
                toast("Base initialisée !");
            } catch (e) {
                statusDiv.innerHTML = "<span class='error-text'>❌ Erreur : " + echapper(e.message) + "</span>";
                toast("Erreur : " + e.message, 'error');
            } finally {
                chargement(btnInit, false);
            }
        });
    </script>
</body>
</html>
