<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>FC Chalosse - Accueil</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FC Chalosse">

    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container">
        <section class="hero">
            <img src="chalosse.webp" alt="Logo FC Chalosse" class="hero-logo">
            <div>
                <p class="hero-kicker">Espace club</p>
                <h1 class="hero-title">FC Chalosse</h1>
                <p class="hero-sub" id="salutation">Bienvenue !</p>
            </div>
        </section>

        <div class="grid-2">
            <section>
                <h2 class="titre-section titre-premiere">À l'affiche · Première</h2>
                <div id="matchs-premiere" class="match-list"><div class="skeleton"></div></div>
            </section>
            <section>
                <h2 class="titre-section titre-reserve">À l'affiche · Réserve</h2>
                <div id="matchs-reserve" class="match-list"><div class="skeleton"></div></div>
            </section>
        </div>

        <section id="zone-admin" class="hidden">
            <h2 class="titre-section">Outils administrateur</h2>
            <div class="quick-grid">
                <a href="ajouter.html" class="quick-tile"><span class="quick-ic">👤</span>Ajouter un joueur</a>
                <a href="ajouter_match.html" class="quick-tile"><span class="quick-ic">➕</span>Ajouter un match</a>
                <a href="gerer_compo.html" class="quick-tile"><span class="quick-ic">📋</span>Compositions</a>
                <a href="saisir_stats.html" class="quick-tile"><span class="quick-ic">📝</span>Saisir les stats</a>
                <a href="gerer_comptes.html" class="quick-tile"><span class="quick-ic">⚙️</span>Comptes</a>
            </div>
        </section>
    </main>

    <script type="module">
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil } from "./js/firebase.js";
        import { versDate } from "./js/ui.js";
        import { carteMatch, activerActionsMatchs } from "./js/matchs.js";

        let estAdmin = false;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }

            const profil = await chargerProfil(user.uid).catch(() => null);
            if (profil?.prenom) document.getElementById('salutation').textContent = `Bonjour ${profil.prenom} 👋`;
            if (profil?.role === "admin") {
                estAdmin = true;
                document.getElementById('zone-admin').classList.remove('hidden');
            }
            chargerDerniersMatchs();
        });

        // Renvoie le match dont la date est la plus proche d'aujourd'hui
        function matchLePlusProche(liste) {
            let meilleur = liste[0];
            let diffMin = Infinity;
            const maintenant = Date.now();
            liste.forEach(m => {
                const date = versDate(m.data.date);
                if (date) {
                    const ecart = Math.abs(date.getTime() - maintenant);
                    if (ecart < diffMin) { diffMin = ecart; meilleur = m; }
                }
            });
            return meilleur;
        }

        async function chargerDerniersMatchs() {
            try {
                const snap = await getDocs(collection(db, "matchs"));
                const premiere = [], reserve = [];
                snap.forEach(d => {
                    const m = { id: d.id, data: d.data() };
                    (m.data.equipe_type === "premiere" ? premiere : reserve).push(m);
                });

                afficher('matchs-premiere', premiere);
                afficher('matchs-reserve', reserve);
            } catch (e) {
                console.error(e);
                document.getElementById('matchs-premiere').innerHTML = `<p class="empty error-text">Erreur de chargement des matchs.</p>`;
                document.getElementById('matchs-reserve').innerHTML = '';
            }
        }

        function afficher(idConteneur, liste) {
            const conteneur = document.getElementById(idConteneur);
            if (liste.length === 0) {
                conteneur.innerHTML = `<p class="empty">Aucun match prévu.</p>`;
                return;
            }
            const m = matchLePlusProche(liste);
            conteneur.innerHTML = carteMatch(m.id, m.data, { admin: estAdmin });
        }

        activerActionsMatchs(chargerDerniersMatchs);
    </script>
</body>
</html>
