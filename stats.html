<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Statistiques - FC Chalosse</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="FC Chalosse">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Statistiques de la saison</h1>
            <p>Touchez un en-tête de colonne pour trier le classement.</p>
        </header>

        <div class="onglets" role="tablist">
            <a href="stats.html" class="btn-onglet actif" style="text-align:center; text-decoration:none">📊 Tableau complet</a>
            <a href="classement.html" class="btn-onglet" style="text-align:center; text-decoration:none">🏆 Homme du match</a>
        </div>

        <div class="toolbar-row">
            <div class="search">
                <input type="search" id="recherche" placeholder="Rechercher un joueur…" autocomplete="off">
            </div>
            <div class="toolbar-actions hidden" id="outils-admin-stats">
                <a href="saisir_stats.html" class="btn-chip primary">📝 Saisir stats</a>
                <button type="button" class="btn-chip" id="btn-reset-saison">🗑️ Réinitialiser toute la saison</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr id="entete-table">
                        <th data-tri="nom" class="trie asc">Joueur</th>
                        <th data-tri="mj" title="Matchs joués">MJ</th>
                        <th data-tri="buts" title="Buts">⚽ Buts</th>
                        <th data-tri="passes" title="Passes décisives">🎯 Passes</th>
                        <th id="th-moyenne" data-tri="moyenne" class="hidden" title="Note moyenne">⭐ Moy.</th>
                        <th data-tri="jaunes" title="Cartons jaunes">🟨</th>
                        <th data-tri="rouges" title="Cartons rouges">🟥</th>
                        <th id="th-admin" class="hidden" title="Supprimer les stats du joueur">Action</th>
                    </tr>
                </thead>
                <tbody id="corps-table">
                    <tr><td colspan="8" class="muted">Calcul en cours…</td></tr>
                </tbody>
            </table>
        </div>
        <div class="legende">
            <span>MJ : matchs joués</span><span>⚽ buts</span><span>🎯 passes décisives</span><span id="legende-moyenne" class="hidden">⭐ note moyenne des votes</span>
        </div>
    </main>

    <script type="module">
        import { collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil, estProfilJoueur, estSuperAdmin, lireCollection, invaliderCache } from "./js/firebase.js";
        import { toast, confirmer, ouvrirModal, chargement, echapper } from "./js/ui.js";
        import { ouvrirFicheJoueur } from "./js/tactique.js";

        let estAdmin = false;
        let estSuper = false;
        let liste = [];
        let cleTri = 'nom';
        let ordreTri = 'asc';

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }
            estSuper = estSuperAdmin(user.email);
            if (estSuper) {
                document.getElementById('th-moyenne').classList.remove('hidden');
                document.getElementById('legende-moyenne').classList.remove('hidden');
            }
            const [profil] = await Promise.all([
                chargerProfil(user.uid).catch(() => null),
                calculerStats()
            ]);
            estAdmin = profil?.role === "admin";
            if (estAdmin) {
                document.getElementById('outils-admin-stats').classList.remove('hidden');
                document.getElementById('th-admin').classList.remove('hidden');
            }
            if (estAdmin || estSuper) afficher();
        });

        async function calculerStats(force = false) {
            try {
                // Chargement parallèle des 3 collections en une seule passe
                const [joueursItems, matchsItems, notesItems] = await Promise.all([
                    lireCollection("utilisateurs", { force }),
                    lireCollection("matchs", { force }),
                    lireCollection("notes", { force })
                ]);

                const statsGlobales = {};
                joueursItems.forEach(({ id, data }) => {
                    if (estProfilJoueur(data)) {
                        statsGlobales[id] = {
                            id,
                            nom: `${data.prenom} ${data.nom || ''}`.trim(),
                            mj: 0, buts: 0, passes: 0, jaunes: 0, rouges: 0,
                            totalNotes: 0, nbVotes: 0
                        };
                    }
                });

                matchsItems.forEach(({ data: m }) => {
                    (m.compo || []).forEach(id => { if (statsGlobales[id]) statsGlobales[id].mj++; });
                    const sMatch = m.stats_joueurs || {};
                    for (const id in sMatch) {
                        if (statsGlobales[id]) {
                            statsGlobales[id].buts += (parseInt(sMatch[id].buts) || 0);
                            statsGlobales[id].passes += (parseInt(sMatch[id].passes) || 0);
                            statsGlobales[id].jaunes += (parseInt(sMatch[id].jaunes) || 0);
                            statsGlobales[id].rouges += (parseInt(sMatch[id].rouges) || 0);
                        }
                    }
                });

                notesItems.forEach(({ id: docId, data: n }) => {
                    const joueurId = n.joueurId || n.joueur_id || docId.split('_')[1];
                    if (statsGlobales[joueurId]) {
                        statsGlobales[joueurId].totalNotes += parseFloat(n.note);
                        statsGlobales[joueurId].nbVotes++;
                    }
                });

                liste = Object.values(statsGlobales).map(s => ({
                    ...s,
                    moyenne: s.nbVotes > 0 ? s.totalNotes / s.nbVotes : -1
                }));
                afficher();
            } catch (error) {
                console.error("Erreur lors du calcul des statistiques :", error);
                document.getElementById('corps-table').innerHTML = `<tr><td colspan="8" class="error-text">Erreur de chargement des statistiques.</td></tr>`;
            }
        }

        const cellule = (val, classe) => `<td class="${val > 0 ? classe : 'c-zero'}">${val}</td>`;

        function afficher() {
            const q = document.getElementById('recherche').value.trim().toLowerCase();
            const sens = ordreTri === 'asc' ? 1 : -1;
            const lignes = liste
                .filter(s => s.nom.toLowerCase().includes(q))
                .sort((a, b) => {
                    if (cleTri === 'nom') {
                        return a.nom.localeCompare(b.nom, 'fr') * sens;
                    }
                    if (cleTri === 'moyenne') {
                        const aSans = a.moyenne < 0, bSans = b.moyenne < 0;
                        if (aSans && bSans) return a.nom.localeCompare(b.nom, 'fr');
                        if (aSans) return 1;
                        if (bSans) return -1;
                    }
                    const diff = (a[cleTri] - b[cleTri]) * sens;
                    return diff !== 0 ? diff : a.nom.localeCompare(b.nom, 'fr');
                });

            const corps = document.getElementById('corps-table');
            const nbCols = 6 + (estSuper ? 1 : 0) + (estAdmin ? 1 : 0);
            if (lignes.length === 0) {
                corps.innerHTML = `<tr><td colspan="${nbCols}" class="muted">${q ? 'Aucun joueur ne correspond.' : 'Aucun joueur dans la base de données.'}</td></tr>`;
                return;
            }
            corps.innerHTML = lignes.map(s => {
                const aDesStats = s.buts > 0 || s.passes > 0 || s.jaunes > 0 || s.rouges > 0 || s.moyenne >= 0 || s.mj > 0;
                const colMoyenne = estSuper
                    ? `<td style="font-weight:700">${s.moyenne >= 0 ? s.moyenne.toFixed(1) : '<span class="c-zero">–</span>'}</td>`
                    : '';
                const colAdmin = estAdmin
                    ? `<td>
                        <button type="button" class="btn-supprimer btn-reset-joueur" data-id="${s.id}" data-nom="${echapper(s.nom)}"
                                style="width:34px; height:34px; font-size:.85rem; ${aDesStats ? '' : 'opacity:.35'}"
                                title="Supprimer les statistiques de ${echapper(s.nom)}">🗑️</button>
                       </td>`
                    : '';
                return `
                    <tr>
                        <td class="nom-joueur" data-joueur-id="${s.id}" style="cursor:pointer" title="Voir la fiche de ${echapper(s.nom)}">${echapper(s.nom)}</td>
                        <td>${s.mj}</td>
                        ${cellule(s.buts, 'c-buts')}
                        ${cellule(s.passes, 'c-passes')}
                        ${colMoyenne}
                        ${cellule(s.jaunes, 'c-jaunes')}
                        ${cellule(s.rouges, 'c-rouges')}
                        ${colAdmin}
                    </tr>`;
            }).join('');
        }

        // Supprimer les statistiques d'un joueur précis
        async function supprimerStatsJoueur(joueurId, nomJoueur) {
            ouvrirModal((boite, fermer) => {
                boite.innerHTML = `
                    <h3 class="modal-title">🗑️ Réinitialiser ${echapper(nomJoueur)}</h3>
                    <p class="modal-text">Choisissez les statistiques à supprimer pour ce joueur :</p>
                    <div style="text-align:left; margin: 14px 0; display: grid; gap: 10px;">
                        <label class="joueur-ligne" style="margin:0; cursor:pointer; border:1px solid var(--border); border-radius:12px; padding:12px;">
                            <span><strong>Buts, passes et cartons</strong><br><small class="muted">Remet à zéro ⚽, 🎯, 🟨 et 🟥 sur tous les matchs</small></span>
                            <input type="checkbox" id="chk-stats" checked>
                        </label>
                        <label class="joueur-ligne" style="margin:0; cursor:pointer; border:1px solid var(--border); border-radius:12px; padding:12px;">
                            <span><strong>Notes et moyenne (⭐)</strong><br><small class="muted">Supprime toutes les notes reçues par ce joueur</small></span>
                            <input type="checkbox" id="chk-notes" checked>
                        </label>
                        <label class="joueur-ligne" style="margin:0; cursor:pointer; border:1px solid var(--border); border-radius:12px; padding:12px;">
                            <span><strong>Matchs joués (MJ / Compos)</strong><br><small class="muted">Retire aussi le joueur des compositions passées</small></span>
                            <input type="checkbox" id="chk-mj">
                        </label>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-modal btn-modal-cancel" id="btn-annuler-reset">Annuler</button>
                        <button type="button" class="btn-modal btn-modal-ok danger" id="btn-confirmer-reset">Supprimer les stats</button>
                    </div>
                `;

                boite.querySelector('#btn-annuler-reset').onclick = () => fermer(false);
                boite.querySelector('#btn-confirmer-reset').onclick = async () => {
                    const effacerStats = boite.querySelector('#chk-stats').checked;
                    const effacerNotes = boite.querySelector('#chk-notes').checked;
                    const effacerMj = boite.querySelector('#chk-mj').checked;

                    if (!effacerStats && !effacerNotes && !effacerMj) {
                        toast("Cochez au moins un élément à réinitialiser.", 'error');
                        return;
                    }

                    const btnOk = boite.querySelector('#btn-confirmer-reset');
                    chargement(btnOk, true, 'Suppression…');
                    try {
                        const promesses = [];

                        if (effacerStats || effacerMj) {
                            const matchsSnap = await getDocs(collection(db, "matchs"));
                            matchsSnap.forEach(mDoc => {
                                const d = mDoc.data();
                                const maj = {};
                                let modifie = false;

                                if (effacerStats && d.stats_joueurs && d.stats_joueurs[joueurId]) {
                                    const copieStats = { ...d.stats_joueurs };
                                    delete copieStats[joueurId];
                                    maj.stats_joueurs = copieStats;
                                    modifie = true;
                                }
                                if (effacerMj && Array.isArray(d.compo) && d.compo.includes(joueurId)) {
                                    maj.compo = d.compo.filter(id => id !== joueurId);
                                    modifie = true;
                                }
                                if (modifie) promesses.push(updateDoc(doc(db, "matchs", mDoc.id), maj));
                            });
                        }

                        if (effacerNotes) {
                            const notesSnap = await getDocs(collection(db, "notes"));
                            notesSnap.forEach(nDoc => {
                                const n = nDoc.data();
                                const idJ = n.joueurId || n.joueur_id || nDoc.id.split('_')[1];
                                if (idJ === joueurId) promesses.push(deleteDoc(doc(db, "notes", nDoc.id)));
                            });
                        }

                        await Promise.all(promesses);
                        invaliderCache("matchs", "notes");
                        toast(`Statistiques de ${nomJoueur} supprimées.`);
                        fermer(true);
                        calculerStats(true);
                    } catch (err) {
                        console.error(err);
                        toast("Erreur : " + err.message, 'error');
                        chargement(btnOk, false);
                    }
                };
            });
        }

        document.getElementById('corps-table').addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-reset-joueur');
            if (btn) {
                supprimerStatsJoueur(btn.dataset.id, btn.dataset.nom);
                return;
            }
            const cellNom = e.target.closest('.nom-joueur[data-joueur-id]');
            if (cellNom) {
                ouvrirFicheJoueur(cellNom.dataset.joueurId);
            }
        });

        // Réinitialiser toutes les statistiques de la saison
        document.getElementById('btn-reset-saison').addEventListener('click', async () => {
            const ok = await confirmer(
                "Voulez-vous remettre à zéro les buts, passes, cartons et notes de TOUS les joueurs sur l'ensemble de la saison ?",
                { titre: 'Réinitialiser toutes les statistiques ?', ok: 'Tout remettre à zéro', danger: true }
            );
            if (!ok) return;

            const btn = document.getElementById('btn-reset-saison');
            chargement(btn, true, 'Réinitialisation…');
            try {
                const promesses = [];
                const matchsSnap = await getDocs(collection(db, "matchs"));
                matchsSnap.forEach(mDoc => {
                    if (mDoc.data().stats_joueurs) {
                        promesses.push(updateDoc(doc(db, "matchs", mDoc.id), { stats_joueurs: {} }));
                    }
                });
                const notesSnap = await getDocs(collection(db, "notes"));
                notesSnap.forEach(nDoc => {
                    promesses.push(deleteDoc(doc(db, "notes", nDoc.id)));
                });
                await Promise.all(promesses);
                invaliderCache("matchs", "notes");
                toast("Toutes les statistiques et notes ont été remises à zéro.");
                calculerStats(true);
            } catch (err) {
                toast("Erreur : " + err.message, 'error');
            } finally {
                chargement(btn, false);
            }
        });

        document.querySelectorAll('th[data-tri]').forEach(th => th.addEventListener('click', () => {
            const nouvelleCle = th.dataset.tri;
            if (nouvelleCle === 'moyenne' && !estSuper) return;
            if (cleTri === nouvelleCle) {
                ordreTri = ordreTri === 'asc' ? 'desc' : 'asc';
            } else {
                cleTri = nouvelleCle;
                ordreTri = cleTri === 'nom' ? 'asc' : 'desc';
            }
            document.querySelectorAll('th[data-tri]').forEach(t => {
                t.classList.toggle('trie', t === th);
                t.classList.toggle('asc', t === th && ordreTri === 'asc');
            });
            afficher();
        }));
        document.getElementById('recherche').addEventListener('input', afficher);
    </script>
</body>
</html>
