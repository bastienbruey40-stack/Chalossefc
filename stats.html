<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Statistiques - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Statistiques de la saison</h1>
            <p>Touchez un en-tête de colonne pour trier le classement.</p>
        </header>

        <div class="onglets" role="tablist">
            <a href="stats.html" class="btn-onglet actif" style="text-align:center; text-decoration:none">📊 Tableau complet</a>
            <a href="classement.html" class="btn-onglet" style="text-align:center; text-decoration:none">🏆 Homme du match</a>
        </div>

        <div class="search">
            <input type="search" id="recherche" placeholder="Rechercher un joueur…" autocomplete="off">
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th data-tri="nom">Joueur</th>
                        <th data-tri="mj" title="Matchs joués">MJ</th>
                        <th data-tri="buts" title="Buts" class="trie">⚽ Buts</th>
                        <th data-tri="passes" title="Passes décisives">🎯 Passes</th>
                        <th data-tri="moyenne" title="Note moyenne">⭐ Moy.</th>
                        <th data-tri="jaunes" title="Cartons jaunes">🟨</th>
                        <th data-tri="rouges" title="Cartons rouges">🟥</th>
                    </tr>
                </thead>
                <tbody id="corps-table">
                    <tr><td colspan="7" class="muted">Calcul en cours…</td></tr>
                </tbody>
            </table>
        </div>
        <div class="legende">
            <span>MJ : matchs joués</span><span>⚽ buts</span><span>🎯 passes décisives</span><span>⭐ note moyenne des votes</span>
        </div>
    </main>

    <script type="module">
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { db } from "./js/firebase.js";
        import { echapper } from "./js/ui.js";

        let liste = [];
        let cleTri = 'buts';

        async function calculerStats() {
            try {
                // 1. Tous les joueurs
                const joueursRef = await getDocs(collection(db, "utilisateurs"));
                const statsGlobales = {};
                joueursRef.forEach(d => {
                    const data = d.data();
                    if (data.role === "joueur") {
                        statsGlobales[d.id] = {
                            nom: `${data.prenom} ${data.nom}`,
                            mj: 0, buts: 0, passes: 0, jaunes: 0, rouges: 0,
                            totalNotes: 0, nbVotes: 0
                        };
                    }
                });

                // 2. Matchs : MJ, buts, passes, cartons
                const matchsRef = await getDocs(collection(db, "matchs"));
                matchsRef.forEach(d => {
                    const m = d.data();
                    (m.compo || []).forEach(id => { if (statsGlobales[id]) statsGlobales[id].mj++; });
                    const sMatch = m.stats_joueurs || {};
                    for (const id in sMatch) {
                        if (statsGlobales[id]) {
                            statsGlobales[id].buts += (parseInt(sMatch[id].buts) || 0);
                            statsGlobales[id].passes += (parseInt(sMatch[id].passes) || 0);
                            statsGlobales[id].jaunes += (parseInt(sMatch[id].jaunes) || 0);
                            statsGlobales[id].rouges += (parseInt(sMatch[id].rouges) || 0);
                        }
                    }
                });

                // 3. Notes : moyenne
                const notesRef = await getDocs(collection(db, "notes"));
                notesRef.forEach(d => {
                    const n = d.data();
                    const joueurId = n.joueurId || d.id.split('_')[1];
                    if (statsGlobales[joueurId]) {
                        statsGlobales[joueurId].totalNotes += parseFloat(n.note);
                        statsGlobales[joueurId].nbVotes++;
                    }
                });

                liste = Object.values(statsGlobales).map(s => ({
                    ...s,
                    moyenne: s.nbVotes > 0 ? s.totalNotes / s.nbVotes : -1
                }));
                afficher();
            } catch (error) {
                console.error("Erreur lors du calcul des statistiques :", error);
                document.getElementById('corps-table').innerHTML = `<tr><td colspan="7" class="error-text">Erreur de chargement des statistiques.</td></tr>`;
            }
        }

        const cellule = (val, classe) => `<td class="${val > 0 ? classe : 'c-zero'}">${val}</td>`;

        function afficher() {
            const q = document.getElementById('recherche').value.trim().toLowerCase();
            const lignes = liste
                .filter(s => s.nom.toLowerCase().includes(q))
                .sort((a, b) => cleTri === 'nom'
                    ? a.nom.localeCompare(b.nom)
                    : (b[cleTri] - a[cleTri]) || (b.buts - a.buts) || (b.mj - a.mj));

            const corps = document.getElementById('corps-table');
            if (lignes.length === 0) {
                corps.innerHTML = `<tr><td colspan="7" class="muted">${q ? 'Aucun joueur ne correspond.' : 'Aucun joueur dans la base de données.'}</td></tr>`;
                return;
            }
            corps.innerHTML = lignes.map(s => `
                <tr>
                    <td class="nom-joueur">${echapper(s.nom)}</td>
                    <td>${s.mj}</td>
                    ${cellule(s.buts, 'c-buts')}
                    ${cellule(s.passes, 'c-passes')}
                    <td style="font-weight:700">${s.moyenne >= 0 ? s.moyenne.toFixed(1) : '<span class="c-zero">–</span>'}</td>
                    ${cellule(s.jaunes, 'c-jaunes')}
                    ${cellule(s.rouges, 'c-rouges')}
                </tr>`).join('');
        }

        document.querySelectorAll('th[data-tri]').forEach(th => th.addEventListener('click', () => {
            cleTri = th.dataset.tri;
            document.querySelectorAll('th[data-tri]').forEach(t => t.classList.toggle('trie', t === th));
            afficher();
        }));
        document.getElementById('recherche').addEventListener('input', afficher);

        calculerStats();
    </script>
</body>
</html>
