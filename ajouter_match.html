<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Ajouter un match - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container narrow">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Nouveau match</h1>
            <p>Ajoutez un match au calendrier de la Première ou de la Réserve.</p>
        </header>

        <form class="card" id="form-match">
            <label style="margin-top:0">Équipe concernée</label>
            <div class="choice-grid" id="choix-equipe">
                <button type="button" class="choice-card premiere active" data-equipe="premiere">
                    <span class="choice-ic">🔵</span>
                    <span>Équipe Première</span>
                </button>
                <button type="button" class="choice-card reserve" data-equipe="reserve">
                    <span class="choice-ic">🟢</span>
                    <span>Équipe Réserve</span>
                </button>
            </div>

            <label for="adversaire">Nom de l'adversaire</label>
            <input type="text" id="adversaire" placeholder="Ex : FC Doazit" required>

            <label for="date">Date du match</label>
            <input type="date" id="date" required>

            <label for="logo">Lien du logo adverse <span class="muted">(optionnel)</span></label>
            <input type="url" id="logo" placeholder="https://…">

            <button class="btn" type="submit" id="btn-creer">Ajouter le match</button>
            <a href="calendrier.html" class="btn-retour">Annuler</a>
        </form>
    </main>

    <script type="module">
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil } from "./js/firebase.js";
        import { toast, flash, chargement } from "./js/ui.js";

        let equipeChoisie = 'premiere';

        document.querySelectorAll('#choix-equipe [data-equipe]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#choix-equipe [data-equipe]').forEach(b => b.classList.toggle('active', b === btn));
                equipeChoisie = btn.dataset.equipe;
            });
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }
            const profil = await chargerProfil(user.uid).catch(() => null);
            if (profil?.role !== "admin") {
                flash("Accès réservé aux administrateurs.", 'error');
                window.location.href = "index.html";
            }
        });

        document.getElementById('form-match').addEventListener('submit', async (e) => {
            e.preventDefault();
            const adversaire = document.getElementById('adversaire').value.trim();
            const date = document.getElementById('date').value;
            if (!adversaire || !date) return toast("Remplissez l'adversaire et la date.", 'error');

            const bouton = document.getElementById('btn-creer');
            chargement(bouton, true);
            try {
                await addDoc(collection(db, "matchs"), {
                    equipe_type: equipeChoisie,
                    adversaire: adversaire,
                    date: date,
                    logo: document.getElementById('logo').value.trim(),
                    compo: []
                });
                flash("Match ajouté au calendrier !");
                window.location.href = "calendrier.html";
            } catch (err) {
                toast("Opération bloquée : " + err.message, 'error', 6000);
                chargement(bouton, false);
            }
        });
    </script>
</body>
</html>
