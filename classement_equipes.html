<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Classement - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Classement FFF</h1>
            <p id="sous-titre-classement">Classement officiel des deux équipes Séniors (District des Landes).</p>
        </header>

        <div class="onglets" role="tablist">
            <button type="button" class="btn-onglet actif" data-equipe="premiere">🔵 Équipe Première</button>
            <button type="button" class="btn-onglet" data-equipe="reserve">🟢 Équipe Réserve</button>
        </div>

        <div class="toolbar-row" style="margin-bottom: 14px;">
            <div id="badge-info-poule" class="muted" style="font-size: .84rem; font-weight: 600;">
                Chargement du classement…
            </div>
            <div class="toolbar-actions">
                <button type="button" class="btn-chip primary hidden" id="btn-import-manuel">📋 Mettre à jour depuis FFF</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width: 44px; text-align:center;">#</th>
                        <th style="text-align:left;">Équipe</th>
                        <th title="Points">Pts</th>
                        <th title="Matchs joués">J</th>
                        <th title="Victoires">G</th>
                        <th title="Matchs nuls">N</th>
                        <th title="Défaites">P</th>
                        <th title="Buts pour">BP</th>
                        <th title="Buts contre">BC</th>
                        <th title="Différence de buts">Diff</th>
                    </tr>
                </thead>
                <tbody id="corps-classement">
                    <tr><td colspan="10" class="muted">Chargement du classement…</td></tr>
                </tbody>
            </table>
        </div>

        <div class="legende">
            <span>Pts : points</span><span>J : joués</span><span>G : gagnés</span><span>N : nuls</span><span>P : perdus</span><span>BP / BC : buts pour / contre</span><span>Diff : différence</span>
        </div>
    </main>

    <script type="module">
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil, lireDoc, invaliderCache } from "./js/firebase.js";
        import { toast, ouvrirModal, chargement, echapper } from "./js/ui.js";
        import { parserClassementFFF, estEquipeChalosse, CLASSEMENTS_FFF_DEFAUT } from "./js/fff_classement.js";
        import { lireClassementDepuisImage } from "./js/fff_ocr.js";
        import { rendreLogoClubHTML, trouverLogoClub } from "./js/logos_clubs.js";

        const LIBELLES_DEFAUT = {
            premiere: { titre: 'Séniors Départemental 2 · Poule A', docId: 'classement_premiere' },
            reserve:  { titre: 'Séniors Départemental 3 · Poule C', docId: 'classement_reserve' }
        };

        let estAdmin = false;
        let equipeActive = 'premiere';
        const donneesClassement = {
            premiere: CLASSEMENTS_FFF_DEFAUT.premiere,
            reserve: CLASSEMENTS_FFF_DEFAUT.reserve
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }

            // Charge en parallèle le profil et les classements sauvegardés dans Firestore
            const [profil, docPremiere, docReserve] = await Promise.all([
                chargerProfil(user.uid).catch(() => null),
                lireDoc("saisons", LIBELLES_DEFAUT.premiere.docId).catch(() => null),
                lireDoc("saisons", LIBELLES_DEFAUT.reserve.docId).catch(() => null)
            ]);

            estAdmin = profil?.role === "admin";
            if (estAdmin) {
                document.getElementById('btn-import-manuel').classList.remove('hidden');
            }

            if (docPremiere?.data?.lignes?.length) donneesClassement.premiere = docPremiere.data;
            if (docReserve?.data?.lignes?.length) donneesClassement.reserve = docReserve.data;

            afficherClassement();
        });

        function formaterMaj(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function afficherClassement() {
            const data = donneesClassement[equipeActive];
            const meta = LIBELLES_DEFAUT[equipeActive];
            const badge = document.getElementById('badge-info-poule');
            const corps = document.getElementById('corps-classement');

            if (!data || !Array.isArray(data.lignes) || data.lignes.length === 0) {
                badge.textContent = meta.titre;
                const aideAdmin = estAdmin
                    ? `<br><span class="muted" style="font-size:.82rem;">Cliquez sur « 📋 Mettre à jour depuis FFF » (Ctrl+A / Ctrl+C sur epreuves.fff.fr) pour enregistrer le classement.</span>`
                    : `<br><span class="muted" style="font-size:.82rem;">Le classement sera bientôt mis à jour par un administrateur. Vous pouvez le consulter sur le site officiel FFF.</span>`;
                corps.innerHTML = `<tr><td colspan="10" style="padding:24px 12px; text-align:center;">Aucun classement enregistré pour l'instant pour cette équipe.${aideAdmin}</td></tr>`;
                return;
            }

            const nomComp = data.competition || meta.titre;
            const pouleTxt = data.poule && !nomComp.toLowerCase().includes(data.poule.toLowerCase()) ? ` · ${data.poule}` : '';
            const journeeTxt = data.journee ? ` · J${data.journee}` : '';
            const majTxt = data.maj ? ` · MàJ ${formaterMaj(data.maj)}` : '';
            badge.textContent = `${nomComp}${pouleTxt}${journeeTxt}${majTxt}`;

            corps.innerHTML = data.lignes.map((l) => {
                const estNous = Boolean(l.estChalosse);
                const clsRow = estNous ? 'row-chalosse' : '';
                const medaille = l.rang === 1 ? '🥇' : (l.rang === 2 ? '🥈' : (l.rang === 3 ? '🥉' : l.rang));
                const diffStr = l.diff > 0 ? `+${l.diff}` : `${l.diff}`;
                const diffCls = l.diff > 0 ? 'c-buts' : (l.diff < 0 ? 'c-rouges' : 'c-zero');

                const logoHtml = rendreLogoClubHTML(l.equipe, {
                    url: l.logo || '',
                    classe: 'logo',
                    style: 'width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;font-size:.85rem;'
                });

                return `
                    <tr class="${clsRow}">
                        <td style="text-align:center; font-weight:800;">${medaille}</td>
                        <td style="text-align:left; font-weight:${estNous ? '800' : '600'};">
                            <div style="display:flex; align-items:center; gap:9px;">
                                ${logoHtml}
                                <span>${echapper(l.equipe)}</span>
                            </div>
                        </td>
                        <td style="font-weight:900; color:var(--jaune);">${l.points}</td>
                        <td>${l.joues}</td>
                        <td>${l.gagnes}</td>
                        <td>${l.nuls}</td>
                        <td>${l.perdus}</td>
                        <td>${l.bp}</td>
                        <td>${l.bc}</td>
                        <td class="${diffCls}" style="font-weight:700;">${diffStr}</td>
                    </tr>`;
            }).join('');
        }

        // Changement d'onglet Équipe Première / Équipe Réserve
        document.querySelectorAll('[data-equipe]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-equipe]').forEach(b => b.classList.toggle('actif', b === btn));
                equipeActive = btn.dataset.equipe;
                afficherClassement();
            });
        });

        // Modale admin : mise à jour par copier-coller texte OU par capture d'écran (OCR haute précision par colonnes)
        document.getElementById('btn-import-manuel').addEventListener('click', () => {
            const labelEquipe = equipeActive === 'premiere' ? 'Équipe Première (D2 · Poule A)' : 'Équipe Réserve (D3 · Poule C)';
            ouvrirModal((boite, fermer) => {
                boite.classList.add('modal-wide');
                boite.innerHTML = `
                    <h3 class="modal-title">📋 Importer le classement · ${echapper(labelEquipe)}</h3>
                    <p class="modal-text">
                        <strong>Option 1 (instantané) :</strong> sur le site FFF (epreuves.fff.fr), faites <strong>Ctrl+A</strong> puis <strong>Ctrl+C</strong>, et collez ci-dessous (<strong>Ctrl+V</strong>).<br>
                        <strong>Option 2 (capture d'écran) :</strong> cliquez sur <strong>📸 Choisir une capture d'écran</strong> ou collez directement votre capture avec <strong>Ctrl+V</strong>.
                    </p>
                    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin: 10px 0 6px;">
                        <label for="input-img-classement" class="btn-chip" style="cursor:pointer; margin:0;">
                            📸 Choisir une capture d'écran
                        </label>
                        <input type="file" id="input-img-classement" accept="image/*" class="hidden">
                        <span id="statut-ocr" class="muted" style="font-size:.8rem;"></span>
                    </div>
                    <textarea id="txt-classement-fff" rows="6" style="margin-top:4px; font-size:.84rem;" placeholder="Collez ici le texte copié depuis epreuves.fff.fr (Ctrl+V)&#10;ou collez directement une capture d'écran (Ctrl+V)…"></textarea>
                    <div id="apercu-parse-classement" class="muted" style="font-size:.82rem; margin-top:8px;"></div>
                    <div class="modal-actions">
                        <button type="button" class="btn-modal btn-modal-cancel" id="btn-annuler-imp">Annuler</button>
                        <button type="button" class="btn-modal btn-modal-ok" id="btn-valider-imp">💾 Enregistrer ce classement</button>
                    </div>
                `;

                const txt = boite.querySelector('#txt-classement-fff');
                const apercu = boite.querySelector('#apercu-parse-classement');
                const inputImg = boite.querySelector('#input-img-classement');
                const statutOcr = boite.querySelector('#statut-ocr');
                let lignesCourantes = [];
                let competitionDetectee = '';

                function rendreApercuEditable() {
                    if (lignesCourantes.length === 0) {
                        if (txt.value.trim().length > 10) {
                            apercu.innerHTML = `<span style="color:var(--orange);">⚠️ Aucune ligne de classement reconnue pour l'instant.</span>`;
                        } else {
                            apercu.textContent = '';
                        }
                        return;
                    }

                    const ch = lignesCourantes.find(l => l.estChalosse);
                    const miniRows = lignesCourantes.map((l, idx) => `
                        <tr data-edit-idx="${idx}" style="${l.estChalosse ? 'background:var(--jaune-doux);' : ''}">
                            <td style="text-align:center; font-weight:800; padding:4px;">${l.rang}</td>
                            <td style="padding:3px;"><input type="text" data-field="equipe" value="${echapper(l.equipe)}" style="width:100%; min-width:130px; padding:4px 6px; font-size:.78rem; font-weight:${l.estChalosse ? '800' : '600'};"></td>
                            <td style="padding:3px;"><input type="number" data-field="points" value="${l.points}" style="width:46px; padding:4px 3px; text-align:center; font-size:.78rem; font-weight:800;"></td>
                            <td style="padding:3px;"><input type="number" data-field="joues" value="${l.joues}" style="width:40px; padding:4px 3px; text-align:center; font-size:.78rem;"></td>
                            <td style="padding:3px;"><input type="number" data-field="gagnes" value="${l.gagnes}" style="width:38px; padding:4px 3px; text-align:center; font-size:.78rem;"></td>
                            <td style="padding:3px;"><input type="number" data-field="nuls" value="${l.nuls}" style="width:38px; padding:4px 3px; text-align:center; font-size:.78rem;"></td>
                            <td style="padding:3px;"><input type="number" data-field="perdus" value="${l.perdus}" style="width:38px; padding:4px 3px; text-align:center; font-size:.78rem;"></td>
                            <td style="padding:3px;"><input type="number" data-field="bp" value="${l.bp}" style="width:42px; padding:4px 3px; text-align:center; font-size:.78rem;"></td>
                            <td style="padding:3px;"><input type="number" data-field="bc" value="${l.bc}" style="width:42px; padding:4px 3px; text-align:center; font-size:.78rem;"></td>
                            <td style="text-align:center; font-weight:700; padding:4px; font-size:.78rem;" data-diff-cell="${idx}">${l.diff > 0 ? '+' + l.diff : l.diff}</td>
                        </tr>
                    `).join('');

                    apercu.innerHTML = `
                        <div style="color:var(--vert); font-weight:700; margin-bottom:6px;">
                            ✅ ${lignesCourantes.length} équipe(s) détectée(s)${ch ? ` · Chalosse : ${ch.rang}e (${ch.points} pts)` : ''}
                            <small class="muted" style="font-weight:500;"> · Vous pouvez corriger une case si besoin avant d'enregistrer.</small>
                        </div>
                        <div style="max-height:220px; overflow:auto; border:1px solid var(--border); border-radius:10px; background:var(--surface-2);">
                            <table style="width:100%; border-collapse:collapse; font-size:.76rem;">
                                <thead>
                                    <tr>
                                        <th style="padding:5px 4px;">#</th>
                                        <th style="padding:5px 4px; text-align:left;">Équipe</th>
                                        <th style="padding:5px 3px;">Pts</th>
                                        <th style="padding:5px 3px;">J</th>
                                        <th style="padding:5px 3px;">G</th>
                                        <th style="padding:5px 3px;">N</th>
                                        <th style="padding:5px 3px;">P</th>
                                        <th style="padding:5px 3px;">BP</th>
                                        <th style="padding:5px 3px;">BC</th>
                                        <th style="padding:5px 4px;">Diff</th>
                                    </tr>
                                </thead>
                                <tbody>${miniRows}</tbody>
                            </table>
                        </div>`;
                }

                // Synchronise les éditions faites directement dans le tableau d'aperçu
                apercu.addEventListener('input', (e) => {
                    const inp = e.target;
                    const tr = inp.closest('tr[data-edit-idx]');
                    if (!tr) return;
                    const idx = parseInt(tr.dataset.editIdx, 10);
                    const field = inp.dataset.field;
                    const ligne = lignesCourantes[idx];
                    if (!ligne || !field) return;

                    if (field === 'equipe') {
                        ligne.equipe = inp.value.trim();
                        ligne.estChalosse = estEquipeChalosse(ligne.equipe);
                        ligne.logo = trouverLogoClub(ligne.equipe, ligne.logo);
                    } else {
                        ligne[field] = parseInt(inp.value, 10) || 0;
                        if (field === 'bp' || field === 'bc') {
                            ligne.diff = ligne.bp - ligne.bc;
                            const diffCell = apercu.querySelector(`[data-diff-cell="${idx}"]`);
                            if (diffCell) diffCell.textContent = ligne.diff > 0 ? `+${ligne.diff}` : `${ligne.diff}`;
                        }
                    }
                });

                function majApercuDepuisTexte() {
                    const res = parserClassementFFF(txt.value);
                    lignesCourantes = res.lignes;
                    competitionDetectee = res.competition || '';
                    rendreApercuEditable();
                }

                async function traiterCaptureImage(fichier) {
                    if (!fichier) return;
                    statutOcr.innerHTML = `<span style="color:var(--jaune);">⏳ Préparation de la capture…</span>`;
                    try {
                        const res = await lireClassementDepuisImage(fichier, (etape) => {
                            statutOcr.innerHTML = `<span style="color:var(--jaune);">⏳ ${echapper(etape)}</span>`;
                        });
                        if (res.lignes.length > 0) {
                            lignesCourantes = res.lignes;
                            txt.value = res.texteTabule;
                            rendreApercuEditable();
                            statutOcr.innerHTML = `<span style="color:var(--vert); font-weight:700;">✓ Capture analysée (${res.lignes.length} équipes) !</span>`;
                        } else {
                            statutOcr.innerHTML = `<span style="color:var(--orange);">⚠️ Aucun tableau reconnu sur cette image. Essayez une capture plus nette du tableau ou le copier-coller texte.</span>`;
                        }
                    } catch (err) {
                        console.error(err);
                        statutOcr.innerHTML = `<span class="error-text">❌ Erreur OCR : ${echapper(err.message)}</span>`;
                    }
                }

                txt.addEventListener('input', majApercuDepuisTexte);

                inputImg.addEventListener('change', (e) => {
                    const f = e.target.files?.[0];
                    if (f) traiterCaptureImage(f);
                    inputImg.value = '';
                });

                // Permet de faire Ctrl+V d'une capture d'écran directement dans la fenêtre !
                boite.addEventListener('paste', (e) => {
                    const items = e.clipboardData?.items;
                    if (!items) return;
                    for (const it of items) {
                        if (it.type && it.type.startsWith('image/')) {
                            e.preventDefault();
                            const blob = it.getAsFile();
                            if (blob) traiterCaptureImage(blob);
                            return;
                        }
                    }
                });

                boite.querySelector('#btn-annuler-imp').onclick = () => fermer(false);
                boite.querySelector('#btn-valider-imp').onclick = async () => {
                    if (lignesCourantes.length < 2) {
                        majApercuDepuisTexte();
                    }
                    if (lignesCourantes.length < 2) {
                        toast("Impossible de détecter le tableau. Vérifiez votre copier-coller depuis epreuves.fff.fr.", 'error', 4500);
                        return;
                    }
                    const btnOk = boite.querySelector('#btn-valider-imp');
                    chargement(btnOk, true, 'Enregistrement…');
                    try {
                        const payload = {
                            competition: competitionDetectee || LIBELLES_DEFAUT[equipeActive].titre,
                            poule: '',
                            source: 'import-fff',
                            maj: new Date().toISOString(),
                            lignes: lignesCourantes
                        };
                        await setDoc(doc(db, "saisons", LIBELLES_DEFAUT[equipeActive].docId), payload);
                        invaliderCache("saisons");
                        donneesClassement[equipeActive] = payload;
                        afficherClassement();
                        toast(`Classement enregistré (${payload.lignes.length} équipes) !`);
                        fermer(true);
                    } catch (err) {
                        toast("Erreur : " + err.message, 'error');
                        chargement(btnOk, false);
                    }
                };
            });
        });
    </script>
</body>
</html>
