<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>FC Chalosse - Classement</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container narrow">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> 🏆 Homme du match</h1>
            <p>Classement général des joueurs selon leur note moyenne.</p>
        </header>

        <div class="onglets" role="tablist">
            <a href="stats.html" class="btn-onglet" style="text-align:center; text-decoration:none">📊 Tableau complet</a>
            <a href="classement.html" class="btn-onglet actif" style="text-align:center; text-decoration:none">🏆 Homme du match</a>
        </div>

        <div class="card" id="liste-classement">
            <div class="skeleton small"></div><div class="skeleton small"></div>
        </div>
    </main>

    <script type="module">
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { db } from "./js/firebase.js";
        import { echapper } from "./js/ui.js";

        async function genererClassement() {
            // 1. Joueurs
            const joueursSnap = await getDocs(collection(db, "utilisateurs"));
            const joueurs = {};
            joueursSnap.forEach(d => {
                if (d.data().role === "joueur") {
                    joueurs[d.id] = { nom: d.data().prenom + " " + d.data().nom, totalNotes: 0, nbNotes: 0 };
                }
            });

            // 2. Notes
            const notesSnap = await getDocs(collection(db, "notes"));
            notesSnap.forEach(d => {
                const n = d.data();
                const id = n.joueur_id || n.joueurId || d.id.split('_')[1];
                if (joueurs[id]) {
                    joueurs[id].totalNotes += parseFloat(n.note);
                    joueurs[id].nbNotes += 1;
                }
            });

            // 3. Moyennes triées
            const classement = Object.values(joueurs)
                .filter(j => j.nbNotes > 0)
                .map(j => ({ nom: j.nom, moyenne: (j.totalNotes / j.nbNotes).toFixed(1) }))
                .sort((a, b) => b.moyenne - a.moyenne);

            // 4. Affichage
            const conteneur = document.getElementById('liste-classement');
            if (classement.length === 0) {
                conteneur.innerHTML = `<p class="muted" style="text-align:center; margin:0">Aucune note enregistrée pour le moment.</p>`;
                return;
            }
            conteneur.innerHTML = classement.map((j, i) => {
                const medaille = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i + 1}.`;
                return `
                    <div class="classement-ligne ${i === 0 ? 'podium-1' : ''}">
                        <span><span class="rang-joueur">${medaille}</span> ${echapper(j.nom)}</span>
                        <span class="note-badge">${j.moyenne} / 10</span>
                    </div>`;
            }).join('');
        }

        genererClassement().catch(err => {
            console.error(err);
            document.getElementById('liste-classement').innerHTML = `<p class="error-text">Erreur de chargement.</p>`;
        });
    </script>
</body>
</html>
