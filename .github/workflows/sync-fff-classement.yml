name: Synchronisation Classements FFF

on:
  # Exécution automatique après les matchs du week-end et en semaine
  schedule:
    - cron: '30 21 * * 0' # Dimanche 21h30 UTC (22h30/23h30 Paris)
    - cron: '0 8 * * 1'   # Lundi 08h00 UTC (09h00/10h00 Paris)
    - cron: '0 8 * * 4'   # Jeudi 08h00 UTC (rattrapage matchs en retard)
  # Permet de lancer la mise à jour manuellement en 1 clic depuis l'onglet Actions de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-fff:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Interroger l'API FFF (Club 529258 - Chalosse FC Laurède)
        run: node scripts/sync_fff_classements.mjs

      - name: Enregistrer les classements si modifiés
        run: |
          if git diff --quiet data/classements_fff.json; then
            echo "Aucun changement dans les classements."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classements_fff.json
          git commit -m "chore(fff): mise a jour automatique des classements"
          git push
