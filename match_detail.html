<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Détail du Match - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container narrow">
        <header class="page-header">
            <div class="toolbar-row" style="margin-bottom: 6px;">
                <h1><img src="chalosse.webp" alt="" class="logo-header"> <span id="titre-match">Match</span></h1>
                <div class="toolbar-actions hidden" id="outils-admin-match">
                    <button type="button" class="btn-chip" id="btn-editer-match">✏️ Modifier le match</button>
                    <button type="button" class="btn-chip" id="btn-suppr-notes-match" title="Effacer toutes les notes de ce match">🗑️ Effacer les notes</button>
                </div>
            </div>
            <p id="sous-titre-match">Chargement…</p>
        </header>

        <div class="onglets" role="tablist">
            <button class="btn-onglet actif" id="btn-noter" data-onglet="noter">📝 Noter</button>
            <button class="btn-onglet" id="btn-classement" data-onglet="classement">📊 Classement</button>
        </div>

        <div id="onglet-noter" class="contenu-onglet actif">
            <div class="card">
                <p class="muted" style="margin-top:0">Donnez une note de 0 à 10 aux joueurs de la compo (par pas de 0,5).</p>
                <div id="liste-compo"><div class="skeleton small"></div><div class="skeleton small"></div></div>
            </div>
            <div class="sticky-actions hidden" id="barre-notes">
                <button class="btn-valider" id="btn-valider-notes">💾 Valider mes notes</button>
            </div>
        </div>

        <div id="onglet-classement" class="contenu-onglet">
            <div id="admin-votants" class="info-admin">
                👥 Total des votants pour ce match : <span id="nb-votants">0</span>
            </div>
            <div class="card" id="liste-classement">
                <p class="muted" style="text-align:center; margin:0">Aucune note attribuée pour le moment.</p>
            </div>
        </div>

        <a href="calendrier.html" class="btn-retour">← Retour au calendrier</a>
    </main>

    <script type="module">
        import { collection, getDocs, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil } from "./js/firebase.js";
        import { toast, confirmer, chargement, echapper, formaterDate } from "./js/ui.js";
        import { editerMatchComplet } from "./js/matchs.js";

        const matchId = new URLSearchParams(window.location.search).get('match');

        let utilisateurActuel = null;
        let estAdmin = false;
        let matchDataCourant = null;
        let notesDocsDuMatch = [];
        let notesExistantes = {};

        function changerOnglet(cible) {
            ['noter', 'classement'].forEach(o => {
                document.getElementById(`btn-${o}`).classList.toggle('actif', o === cible);
                document.getElementById(`onglet-${o}`).classList.toggle('actif', o === cible);
            });
        }
        document.querySelectorAll('[data-onglet]').forEach(b => b.addEventListener('click', () => changerOnglet(b.dataset.onglet)));

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }
            utilisateurActuel = user;
            const profil = await chargerProfil(user.uid).catch(() => null);
            estAdmin = profil?.role === "admin";
            if (estAdmin) document.getElementById('outils-admin-match').classList.remove('hidden');

            if (!matchId) { window.location.href = "index.html"; return; }
            chargerDetailsMatch();
        });

        async function chargerDetailsMatch() {
            try {
                const matchSnap = await getDoc(doc(db, "matchs", matchId));
                if (!matchSnap.exists()) {
                    document.getElementById('liste-compo').innerHTML = `<p class="error-text">Ce match n'existe plus.</p>`;
                    return;
                }

                const matchData = matchSnap.data();
                matchDataCourant = matchData;
                document.getElementById('titre-match').textContent = `Contre ${matchData.adversaire}`;
                const score = (matchData.score_chalosse !== undefined && matchData.score_chalosse !== null)
                    ? ` · Score : ${matchData.score_chalosse} - ${matchData.score_adversaire}` : '';
                document.getElementById('sous-titre-match').textContent =
                    `${matchData.equipe_type === 'premiere' ? 'Équipe Première' : 'Équipe Réserve'} · ${formaterDate(matchData.date)}${score}`;

                const compoIds = matchData.compo || [];
                if (compoIds.length === 0) {
                    document.getElementById('liste-compo').innerHTML = `<p class="empty" style="margin:0">Aucune composition pour ce match.</p>`;
                    return;
                }

                const joueursInfos = {};
                const usersSnap = await getDocs(collection(db, "utilisateurs"));
                usersSnap.forEach(u => {
                    if (compoIds.includes(u.id)) joueursInfos[u.id] = `${u.data().prenom} ${u.data().nom}`;
                });

                const notesSnap = await getDocs(collection(db, "notes"));
                const statsMatch = {};
                const votantsUniques = new Set();
                notesExistantes = {};
                notesDocsDuMatch = [];

                compoIds.forEach(id => {
                    if (joueursInfos[id]) statsMatch[id] = { nom: joueursInfos[id], total: 0, nb: 0 };
                });

                notesSnap.forEach(nDoc => {
                    const noteData = nDoc.data();
                    const parts = nDoc.id.split('_');
                    if (parts[0] === matchId || noteData.matchId === matchId || noteData.match_id === matchId) {
                        notesDocsDuMatch.push(nDoc.id);
                        const jId = parts[1] || noteData.joueurId || noteData.joueur_id;
                        const voterId = parts[2] || noteData.voterId || noteData.votant_id;
                        if (voterId) votantsUniques.add(voterId);
                        if (voterId === utilisateurActuel.uid) notesExistantes[jId] = parseFloat(noteData.note);
                        if (statsMatch[jId]) {
                            statsMatch[jId].total += parseFloat(noteData.note);
                            statsMatch[jId].nb++;
                        }
                    }
                });

                if (estAdmin) {
                    document.getElementById('admin-votants').style.display = 'block';
                    document.getElementById('nb-votants').textContent = votantsUniques.size;
                }

                afficherClassement(statsMatch);

                document.getElementById('liste-compo').innerHTML = compoIds.filter(id => joueursInfos[id]).map(jId => {
                    const noteSaved = notesExistantes[jId] !== undefined ? notesExistantes[jId] : "";
                    return `
                        <div class="joueur-ligne">
                            <span class="joueur-nom">${echapper(joueursInfos[jId])}</span>
                            <input type="number" inputmode="decimal" class="input-note note-joueur" data-id="${jId}"
                                   min="0" max="10" step="0.5" value="${noteSaved}" placeholder="/10" aria-label="Note de ${echapper(joueursInfos[jId])}">
                        </div>`;
                }).join('');
                document.getElementById('barre-notes').classList.remove('hidden');
            } catch (error) {
                console.error("Erreur :", error);
                toast("Erreur de chargement du match.", 'error');
            }
        }

        function afficherClassement(statsMatch) {
            const liste = [];
            for (const id in statsMatch) {
                if (statsMatch[id].nb > 0) {
                    liste.push({ nom: statsMatch[id].nom, moyenne: (statsMatch[id].total / statsMatch[id].nb).toFixed(1), nb: statsMatch[id].nb });
                }
            }
            if (liste.length === 0) {
                document.getElementById('liste-classement').innerHTML =
                    `<p class="muted" style="text-align:center; margin:0">Aucune note attribuée pour le moment.</p>`;
                return;
            }

            liste.sort((a, b) => b.moyenne - a.moyenne);
            document.getElementById('liste-classement').innerHTML = liste.map((j, index) => {
                const rang = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `${index + 1}.`;
                return `
                    <div class="classement-ligne ${index === 0 ? 'podium-1' : ''}">
                        <span><span class="rang-joueur">${rang}</span> ${echapper(j.nom)}</span>
                        <span class="note-badge">${j.moyenne} / 10</span>
                    </div>`;
            }).join('');
        }

        // Bouton admin : modifier toutes les informations du match
        document.getElementById('btn-editer-match').addEventListener('click', async () => {
            if (!matchDataCourant) return;
            const modifie = await editerMatchComplet(matchId, matchDataCourant);
            if (modifie) chargerDetailsMatch();
        });

        // Bouton admin : supprimer toutes les notes de ce match
        document.getElementById('btn-suppr-notes-match').addEventListener('click', async () => {
            if (notesDocsDuMatch.length === 0) {
                toast("Aucune note à supprimer sur ce match.", 'info');
                return;
            }
            const ok = await confirmer(
                `Toutes les notes attribuées sur ce match (${notesDocsDuMatch.length} note(s)) seront supprimées.`,
                { titre: 'Effacer les notes du match ?', ok: 'Effacer les notes', danger: true }
            );
            if (!ok) return;
            try {
                await Promise.all(notesDocsDuMatch.map(id => deleteDoc(doc(db, "notes", id))));
                toast("Notes du match supprimées.");
                chargerDetailsMatch();
            } catch (err) {
                toast("Erreur : " + err.message, 'error');
            }
        });

        document.getElementById('btn-valider-notes').addEventListener('click', async () => {
            if (!utilisateurActuel) return;
            const bouton = document.getElementById('btn-valider-notes');

            const promesses = [];
            let invalide = false;
            document.querySelectorAll('.note-joueur').forEach(input => {
                const val = input.value.trim().replace(',', '.');
                if (val === "") return;
                const note = parseFloat(val);
                if (isNaN(note) || note < 0 || note > 10) { invalide = true; return; }
                const joueurId = input.dataset.id;
                promesses.push(setDoc(doc(db, "notes", `${matchId}_${joueurId}_${utilisateurActuel.uid}`), {
                    matchId: matchId,
                    joueurId: joueurId,
                    voterId: utilisateurActuel.uid,
                    note: note,
                    date: new Date().toISOString()
                }));
            });

            if (invalide) return toast("Certaines notes ne sont pas entre 0 et 10.", 'error');
            if (promesses.length === 0) return toast("Vous n'avez saisi aucune note.", 'error');

            chargement(bouton, true);
            try {
                await Promise.all(promesses);
                toast("Vos notes ont bien été enregistrées !");
                await chargerDetailsMatch();
                changerOnglet('classement');
            } catch (error) {
                console.error("Erreur d'enregistrement :", error);
                toast("Une erreur s'est produite lors de la sauvegarde.", 'error');
            } finally {
                chargement(bouton, false);
            }
        });
    </script>
</body>
</html>
