<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Gérer les Compos - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Compositions</h1>
            <p>Choisissez un match puis cochez les joueurs convoqués.</p>
        </header>

        <div class="card">
            <div class="form-row">
                <div>
                    <label for="select-premiere" style="margin-top:0">🔵 Équipe Première</label>
                    <select id="select-premiere" class="team-select-premiere">
                        <option value="">Chargement…</option>
                    </select>
                </div>
                <div>
                    <label for="select-reserve">🟢 Équipe Réserve</label>
                    <select id="select-reserve" class="team-select-reserve">
                        <option value="">Chargement…</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="zone-joueurs" class="hidden">
            <h2 class="titre-section">Joueurs <span class="count">triés par nombre d'apparitions</span></h2>
            <div class="search">
                <input type="search" id="recherche" placeholder="Filtrer les joueurs…" autocomplete="off">
            </div>
            <div class="compo-grid" id="liste-joueurs"></div>

            <div class="sticky-actions">
                <span class="sticky-info"><strong id="nb-selection">0</strong> sélectionné(s)</span>
                <button class="btn-valider" id="btn-sauvegarder">💾 Valider la composition</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil } from "./js/firebase.js";
        import { toast, flash, chargement, echapper, formaterDate } from "./js/ui.js";
        import { trierParDate } from "./js/matchs.js";

        let matchActifId = null;
        let listeTousLesJoueurs = [];
        let compteursApparitions = {};

        const selPremiere = document.getElementById('select-premiere');
        const selReserve = document.getElementById('select-reserve');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }
            const profil = await chargerProfil(user.uid).catch(() => null);
            if (profil?.role === "admin") {
                initialiserPage();
            } else {
                flash("Accès réservé aux administrateurs.", 'error');
                window.location.href = "index.html";
            }
        });

        async function initialiserPage() {
            try {
                listeTousLesJoueurs = [];
                compteursApparitions = {};

                // 1. Uniquement les JOUEURS ou ADMINS
                const usersSnap = await getDocs(collection(db, "utilisateurs"));
                usersSnap.forEach(u => {
                    const data = u.data();
                    if (data.prenom && (data.role === "joueur" || data.role === "admin")) {
                        listeTousLesJoueurs.push({ id: u.id, nom: `${data.prenom} ${data.nom}` });
                        compteursApparitions[u.id] = { premiere: 0, reserve: 0 };
                    }
                });

                // 2. Matchs + calcul des anciennes compos
                const matchsSnap = await getDocs(collection(db, "matchs"));
                const matchs = [];
                matchsSnap.forEach(d => matchs.push({ id: d.id, data: d.data() }));
                trierParDate(matchs);

                let optionsPremiere = '<option value="">— Choisir un match de la Première —</option>';
                let optionsReserve = '<option value="">— Choisir un match de la Réserve —</option>';

                matchs.forEach(({ id, data }) => {
                    const typeEquipe = data.equipe_type === "premiere" ? "premiere" : "reserve";
                    const option = `<option value="${id}">${echapper(data.adversaire)} · ${echapper(formaterDate(data.date))}</option>`;
                    if (typeEquipe === "premiere") optionsPremiere += option;
                    else optionsReserve += option;

                    if (Array.isArray(data.compo)) {
                        data.compo.forEach(joueurId => {
                            if (compteursApparitions[joueurId]) compteursApparitions[joueurId][typeEquipe]++;
                        });
                    }
                });

                const valP = selPremiere.value, valR = selReserve.value;
                selPremiere.innerHTML = optionsPremiere;
                selReserve.innerHTML = optionsReserve;
                selPremiere.value = valP;
                selReserve.value = valR;
            } catch (error) {
                console.error("Erreur de chargement :", error);
                toast("Erreur de chargement des données.", 'error');
            }
        }

        async function changerMatch(equipeSelectionnee) {
            if (equipeSelectionnee === 'premiere') {
                selReserve.value = "";
                matchActifId = selPremiere.value;
            } else {
                selPremiere.value = "";
                matchActifId = selReserve.value;
            }

            const zone = document.getElementById('zone-joueurs');
            if (!matchActifId) { zone.classList.add('hidden'); return; }

            listeTousLesJoueurs.sort((a, b) => {
                const nbA = compteursApparitions[a.id][equipeSelectionnee];
                const nbB = compteursApparitions[b.id][equipeSelectionnee];
                if (nbB !== nbA) return nbB - nbA;
                return a.nom.localeCompare(b.nom);
            });

            const matchDoc = await getDoc(doc(db, "matchs", matchActifId));
            const compoEnregistree = (matchDoc.exists() && matchDoc.data().compo) || [];

            document.getElementById('liste-joueurs').innerHTML = listeTousLesJoueurs.map(joueur => {
                const coche = compoEnregistree.includes(joueur.id) ? "checked" : "";
                const nb = compteursApparitions[joueur.id][equipeSelectionnee];
                const badge = nb > 0 ? `<span class="stats-badge">${nb} match${nb > 1 ? 's' : ''}</span>` : "";
                return `
                    <label class="joueur-ligne" data-nom="${echapper(joueur.nom.toLowerCase())}">
                        <div>
                            <span class="joueur-nom">${echapper(joueur.nom)}</span>
                            ${badge}
                        </div>
                        <input type="checkbox" class="checkbox-compo" value="${joueur.id}" ${coche}>
                    </label>`;
            }).join('');

            document.getElementById('recherche').value = '';
            majCompteur();
            zone.classList.remove('hidden');
        }

        function majCompteur() {
            document.getElementById('nb-selection').textContent = document.querySelectorAll('.checkbox-compo:checked').length;
        }

        selPremiere.addEventListener('change', () => changerMatch('premiere'));
        selReserve.addEventListener('change', () => changerMatch('reserve'));
        document.getElementById('liste-joueurs').addEventListener('change', majCompteur);
        document.getElementById('recherche').addEventListener('input', (e) => {
            const q = e.target.value.trim().toLowerCase();
            document.querySelectorAll('#liste-joueurs .joueur-ligne').forEach(l => {
                l.classList.toggle('hidden', !l.dataset.nom.includes(q));
            });
        });

        document.getElementById('btn-sauvegarder').addEventListener('click', async () => {
            if (!matchActifId) return;
            const bouton = document.getElementById('btn-sauvegarder');
            chargement(bouton, true);

            const nouvelleCompo = [...document.querySelectorAll('.checkbox-compo:checked')].map(c => c.value);
            try {
                await updateDoc(doc(db, "matchs", matchActifId), { compo: nouvelleCompo });
                toast(`Composition enregistrée (${nouvelleCompo.length} joueurs)`);
                await initialiserPage();
            } catch (error) {
                console.error("Erreur de sauvegarde :", error);
                toast("Une erreur est survenue lors de l'enregistrement.", 'error');
            } finally {
                chargement(bouton, false);
            }
        });
    </script>
</body>
</html>
