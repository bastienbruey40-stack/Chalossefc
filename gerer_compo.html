<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Gérer les Compos - FC Chalosse</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="FC Chalosse">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Compositions &amp; Tactique</h1>
            <p>Choisissez votre dispositif, placez vos 11 titulaires sur le terrain et sélectionnez les remplaçants.</p>
        </header>

        <div class="card">
            <label style="margin-top:0">1. Choisir l'équipe</label>
            <div class="choice-grid" id="choix-equipe" style="margin-bottom: 16px;">
                <button type="button" class="choice-card premiere active" data-equipe="premiere">
                    <span class="choice-ic">🔵</span>
                    <span>Équipe Première</span>
                    <span class="choice-sub" id="sub-nb-premiere">Chargement…</span>
                </button>
                <button type="button" class="choice-card reserve" data-equipe="reserve">
                    <span class="choice-ic">🟢</span>
                    <span>Équipe Réserve</span>
                    <span class="choice-sub" id="sub-nb-reserve">Chargement…</span>
                </button>
            </div>

            <label>2. Choisir le match</label>
            <div id="picker-match"></div>
        </div>

        <div id="zone-tactique" class="hidden">
            <!-- Choix du dispositif -->
            <div class="card" style="margin-top: 16px;">
                <div class="toolbar-row" style="margin-bottom: 4px;">
                    <label style="margin: 0;">3. Dispositif tactique</label>
                    <div class="toolbar-actions">
                        <button type="button" class="btn-chip primary" id="btn-importer-noms" style="font-size:.8rem; padding:6px 11px;" title="Saisie rapide assistée avec suggestions ou import FFF">⚡ Saisir / Importer compo</button>
                        <button type="button" class="btn-chip" id="btn-vider-compo" style="font-size:.8rem; padding:6px 11px;">🗑️ Vider le terrain</button>
                    </div>
                </div>
                <div class="formation-pills" id="liste-dispositifs"></div>
                <p class="muted" id="desc-dispositif" style="font-size: .82rem; margin: 8px 0 0;"></p>
            </div>

            <!-- Terrain de foot interactif -->
            <p class="muted" style="text-align:center; font-size:.84rem; margin: 16px 0 10px;">
                👆 Touchez un poste sur le terrain pour placer ou changer un joueur
            </p>
            <div id="conteneur-terrain"></div>

            <!-- Banc des remplaçants -->
            <div class="card bench-card">
                <div class="toolbar-row" style="margin-bottom: 4px;">
                    <div>
                        <strong style="font-size: 1rem;">🪑 Banc des remplaçants</strong>
                        <span class="count" id="nb-remplacants" style="margin-left: 8px;">0</span>
                    </div>
                    <button type="button" class="btn-chip primary" id="btn-ajouter-remplacant" style="padding: 8px 12px; font-size: .84rem;">➕ Ajouter un remplaçant</button>
                </div>
                <div id="liste-remplacants" class="bench-grid"></div>
            </div>

            <!-- Récapitulatif & ajout rapide depuis l'effectif -->
            <div style="max-width: 580px; margin: 22px auto 0;">
                <h2 class="titre-section" style="margin-top: 0;">Effectif disponible <span class="count">ajout rapide</span></h2>
                <div class="search">
                    <input type="search" id="recherche" placeholder="Rechercher un joueur ou un poste…" autocomplete="off">
                </div>
                <div class="card" id="liste-joueurs" style="padding: 10px 16px;"></div>
            </div>

            <div class="sticky-actions" style="max-width: 580px; margin-left: auto; margin-right: auto;">
                <span class="sticky-info">
                    <strong id="nb-titulaires-bar">0</strong>/11 tit. · <strong id="nb-remp-bar">0</strong> remp.
                </span>
                <button class="btn-valider" id="btn-sauvegarder">💾 Enregistrer la compo</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil, estProfilJoueur, lireCollection, lireDoc, invaliderCache } from "./js/firebase.js";
        import { toast, flash, confirmer, ouvrirModal, chargement, echapper, initiales, formaterDate, versDate, creerSelectCustom } from "./js/ui.js";
        import { trierParDate } from "./js/matchs.js";
        import { DISPOSITIFS, extraireCompoTactique, compilerListeCompo, rendreTerrainHTML, obtenirNumeroJoueur, ouvrirFicheJoueur } from "./js/tactique.js";
        import { creerJoueurEffectif } from "./js/fff_import.js";
        import { parserFeuilleFFF, associerJoueurFFF, construireIndexJoueurs, formaterNomPrenomFFF, normaliserNom } from "./js/fff_parser.js";

        let equipeActive = 'premiere';
        let matchActifId = null;
        let listeTousLesJoueurs = [];
        let joueursMap = {};
        let tousLesMatchs = [];
        let compteursApparitions = {};

        // État tactique du match actif
        let dispositifActif = "4-3-3";
        let titulaires = {};   // { "0": joueurId, ... "10": joueurId }
        let remplacants = [];  // [joueurId, ...]
        let numeros = {};      // { joueurId: 1..14 }

        const selectMatch = creerSelectCustom('picker-match', {
            placeholder: 'Sélectionner un match…',
            iconePlaceholder: '⚽',
            onChange: (id) => chargerCompoDuMatch(id)
        });

        // Génère les boutons de choix de dispositif (4-3-3, 4-4-2, etc.)
        const conteneurDispositifs = document.getElementById('liste-dispositifs');
        conteneurDispositifs.innerHTML = Object.keys(DISPOSITIFS).map(code =>
            `<button type="button" class="formation-pill" data-disp="${echapper(code)}">${echapper(code)}</button>`
        ).join('');

        conteneurDispositifs.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-disp]');
            if (!btn) return;
            dispositifActif = btn.dataset.disp;
            rafraichirVueTactique();
            sauvegarderCompoAuto();
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }
            const profil = await chargerProfil(user.uid).catch(() => null);
            if (profil?.role === "admin") {
                initialiserPage();
            } else {
                flash("Accès réservé aux administrateurs.", 'error');
                window.location.href = "index.html";
            }
        });

        async function initialiserPage(force = false) {
            try {
                listeTousLesJoueurs = [];
                joueursMap = {};
                compteursApparitions = {};

                // Chargement parallèle des joueurs et des matchs
                const [usersItems, matchsItems] = await Promise.all([
                    lireCollection("utilisateurs", { force }),
                    lireCollection("matchs", { force })
                ]);

                usersItems.forEach(({ id, data }) => {
                    if (estProfilJoueur(data)) {
                        const j = {
                            id,
                            prenom: data.prenom,
                            nom: data.nom || '',
                            nomComplet: `${data.prenom} ${data.nom || ''}`.trim(),
                            poste: data.poste || 'Milieu',
                            numero: (data.numero >= 1 && data.numero <= 14) ? Number(data.numero) : null
                        };
                        listeTousLesJoueurs.push(j);
                        joueursMap[id] = j;
                        compteursApparitions[id] = { premiere: 0, reserve: 0 };
                    }
                });

                tousLesMatchs = [...matchsItems];
                trierParDate(tousLesMatchs);

                tousLesMatchs.forEach(({ data }) => {
                    const typeEquipe = data.equipe_type === "premiere" ? "premiere" : "reserve";
                    if (Array.isArray(data.compo)) {
                        data.compo.forEach(joueurId => {
                            if (compteursApparitions[joueurId]) compteursApparitions[joueurId][typeEquipe]++;
                        });
                    }
                });

                majCompteursEquipes();

                // Si un match est actif, passé dans l'URL (?match=...) ou mémorisé en session, on le restaure
                const cibleId = matchActifId || new URLSearchParams(window.location.search).get('match') || sessionStorage.getItem('chalosse_compo_match_id');
                const mCible = cibleId ? tousLesMatchs.find(m => m.id === cibleId) : null;
                if (mCible) {
                    const dejaCharge = matchActifId === cibleId;
                    equipeActive = mCible.data.equipe_type === 'reserve' ? 'reserve' : 'premiere';
                    document.querySelectorAll('#choix-equipe [data-equipe]').forEach(b =>
                        b.classList.toggle('active', b.dataset.equipe === equipeActive)
                    );
                    rafraichirMenuMatchs(dejaCharge);
                    selectMatch.setValue(cibleId, false);
                    if (!dejaCharge) {
                        await chargerCompoDuMatch(cibleId);
                    }
                    return;
                }

                rafraichirMenuMatchs(true);
            } catch (error) {
                console.error("Erreur de chargement :", error);
                toast("Erreur de chargement des données.", 'error');
            }
        }

        function majCompteursEquipes() {
            let nbP = 0, nbPAFaire = 0, nbR = 0, nbRAFaire = 0;
            tousLesMatchs.forEach(({ data }) => {
                const aFaire = !Array.isArray(data.compo) || data.compo.length === 0;
                if (data.equipe_type === "premiere") {
                    nbP++;
                    if (aFaire) nbPAFaire++;
                } else {
                    nbR++;
                    if (aFaire) nbRAFaire++;
                }
            });
            document.getElementById('sub-nb-premiere').textContent =
                `${nbP} match${nbP > 1 ? 's' : ''}${nbPAFaire > 0 ? ` · ${nbPAFaire} à faire` : ''}`;
            document.getElementById('sub-nb-reserve').textContent =
                `${nbR} match${nbR > 1 ? 's' : ''}${nbRAFaire > 0 ? ` · ${nbRAFaire} à faire` : ''}`;
        }

        function rafraichirMenuMatchs(garderSelection = false) {
            const matchsEquipe = tousLesMatchs
                .filter(m => (m.data.equipe_type === 'premiere' ? 'premiere' : 'reserve') === equipeActive)
                .sort((a, b) => {
                    const aAFaire = (!Array.isArray(a.data.compo) || a.data.compo.length === 0) ? 0 : 1;
                    const bAFaire = (!Array.isArray(b.data.compo) || b.data.compo.length === 0) ? 0 : 1;
                    if (aAFaire !== bAFaire) return aAFaire - bAFaire;

                    const tA = versDate(a.data.date)?.getTime() ?? Infinity;
                    const tB = versDate(b.data.date)?.getTime() ?? Infinity;
                    // Compos "À faire" en premier (ordre chronologique), puis compos déjà faites (plus récentes en premier)
                    return aAFaire === 0 ? (tA - tB) : (tB - tA);
                });

            const options = matchsEquipe.map(({ id, data }) => {
                const nb = Array.isArray(data.compo) ? data.compo.length : 0;
                const disp = data.compo_tactique?.dispositif ? ` · ${data.compo_tactique.dispositif}` : '';
                return {
                    value: id,
                    dot: equipeActive,
                    label: `Contre ${data.adversaire || 'Adversaire'}`,
                    sub: `${formaterDate(data.date)}${disp}`,
                    badge: nb > 0 ? `${nb} joueur${nb > 1 ? 's' : ''}` : 'À faire',
                    badgeClass: nb > 0 ? 'ok' : 'warn'
                };
            });
            selectMatch.setOptions(options, garderSelection);
            if (!garderSelection) {
                matchActifId = null;
                document.getElementById('zone-tactique').classList.add('hidden');
            }
        }

        document.querySelectorAll('#choix-equipe [data-equipe]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#choix-equipe [data-equipe]').forEach(b => b.classList.toggle('active', b === btn));
                equipeActive = btn.dataset.equipe;
                sessionStorage.removeItem('chalosse_compo_match_id');
                window.history.replaceState(null, '', window.location.pathname);
                rafraichirMenuMatchs(false);
            });
        });

        async function chargerCompoDuMatch(idMatch) {
            matchActifId = idMatch;
            const zone = document.getElementById('zone-tactique');
            if (!matchActifId) {
                sessionStorage.removeItem('chalosse_compo_match_id');
                window.history.replaceState(null, '', window.location.pathname);
                zone.classList.add('hidden');
                return;
            }

            sessionStorage.setItem('chalosse_compo_match_id', matchActifId);
            window.history.replaceState(null, '', '?match=' + encodeURIComponent(matchActifId));

            const enMemoire = tousLesMatchs.find(m => m.id === matchActifId);
            const matchRes = enMemoire || await lireDoc("matchs", matchActifId);
            const matchData = matchRes ? matchRes.data : {};
            const etat = extraireCompoTactique(matchData);

            dispositifActif = etat.dispositif;
            titulaires = { ...etat.titulaires };
            remplacants = [...etat.remplacants];
            numeros = { ...(etat.numeros || {}) };

            document.getElementById('recherche').value = '';
            rafraichirVueTactique();
            zone.classList.remove('hidden');
        }

        let sauvegardeEnCours = Promise.resolve();

        function sauvegarderCompoAuto() {
            if (!matchActifId) return;
            const matchCibleId = matchActifId;
            const listeCompoPlate = compilerListeCompo(titulaires, remplacants);
            const compoTactique = {
                dispositif: dispositifActif,
                titulaires: { ...titulaires },
                remplacants: [...remplacants],
                numeros: { ...numeros }
            };

            const entree = tousLesMatchs.find(m => m.id === matchCibleId);
            if (entree) {
                entree.data.compo = listeCompoPlate;
                entree.data.compo_tactique = compoTactique;
                majCompteursEquipes();
                rafraichirMenuMatchs(true);
            }

            sauvegardeEnCours = sauvegardeEnCours.then(async () => {
                try {
                    await updateDoc(doc(db, "matchs", matchCibleId), {
                        compo: listeCompoPlate,
                        compo_tactique: compoTactique
                    });
                    invaliderCache("matchs");
                } catch (error) {
                    console.error("Erreur de sauvegarde automatique :", error);
                    toast("Erreur lors de la sauvegarde automatique.", 'error');
                }
            });
            return sauvegardeEnCours;
        }

        function trouverSlotDuJoueur(joueurId) {
            for (let i = 0; i < 11; i++) {
                if (titulaires[i] === joueurId) return i;
            }
            return -1;
        }

        function obtenirNumeroActuel(joueurId) {
            const slot = trouverSlotDuJoueur(joueurId);
            const bIdx = remplacants.indexOf(joueurId);
            return obtenirNumeroJoueur(joueurId, {
                numeros,
                joueursMap,
                slotIndex: slot !== -1 ? slot : null,
                benchIndex: bIdx !== -1 ? bIdx : null,
                dispositif: dispositifActif
            });
        }

        function trouverJoueurPortantNumero(num, exclureId = null) {
            const convoques = [...Object.values(titulaires), ...remplacants];
            for (const id of convoques) {
                if (id && id !== exclureId && obtenirNumeroActuel(id) === num) return id;
            }
            return null;
        }

        function attribuerNumero(joueurId, nouveauNum, { silencieux = false } = {}) {
            const n = parseInt(nouveauNum, 10);
            if (!joueurId || isNaN(n) || n < 1 || n > 14) return;
            const ancienNum = obtenirNumeroActuel(joueurId);
            const autreId = trouverJoueurPortantNumero(n, joueurId);
            if (autreId && ancienNum >= 1 && ancienNum <= 14 && ancienNum !== n) {
                numeros[autreId] = ancienNum;
            }
            numeros[joueurId] = n;
            if (!silencieux) {
                rafraichirVueTactique();
                sauvegarderCompoAuto();
            }
        }

        function construireGrilleNumerosHTML(numActif, exclureId = null) {
            return Array.from({ length: 14 }, (_, i) => i + 1).map(n => {
                const autreId = trouverJoueurPortantNumero(n, exclureId);
                const autre = autreId ? joueursMap[autreId] : null;
                const titre = autre
                    ? `Porté par ${autre.nomComplet} (cliquer pour échanger)`
                    : `Choisir le n°${n}`;
                return `<button type="button" class="num-pill${numActif === n ? ' active' : ''}${autre ? ' used' : ''}" data-pick-num="${n}" title="${echapper(titre)}">${n}</button>`;
            }).join('');
        }

        function ouvrirChoixNumeroJoueur(joueurId) {
            const j = joueursMap[joueurId];
            if (!j) return;
            const slot = trouverSlotDuJoueur(joueurId);
            const config = DISPOSITIFS[dispositifActif] || DISPOSITIFS["4-3-3"];
            const codePoste = slot !== -1 ? config.postes[slot]?.code : 'Remp.';

            ouvrirModal((boite, fermer) => {
                const actif = obtenirNumeroActuel(joueurId);
                boite.innerHTML = `
                    <h3 class="modal-title">👕 Numéro de ${echapper(j.nomComplet)} ${actif ? `<span class="tag" style="vertical-align:middle;">n°${actif}</span>` : ''}</h3>
                    <p class="modal-text">Choisissez un numéro de maillot entre <strong>1 et 14</strong>. S'il est déjà porté par un coéquipier, les numéros sont échangés automatiquement.</p>
                    <div class="num-picker-box">
                        <div class="num-picker-grid" id="grille-nums-rapide">
                            ${construireGrilleNumerosHTML(actif, joueurId)}
                        </div>
                    </div>
                    <div class="modal-actions" style="justify-content:space-between;">
                        <button type="button" class="btn-chip" id="btn-fiche-rapide" style="padding:8px 12px; font-size:.82rem;">👁️ Voir la fiche</button>
                        <button type="button" class="btn-modal btn-modal-ok" id="btn-fermer-num">Fermer</button>
                    </div>
                `;

                boite.querySelector('#grille-nums-rapide').addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-pick-num]');
                    if (!btn) return;
                    attribuerNumero(joueurId, Number(btn.dataset.pickNum));
                    fermer(true);
                });
                boite.querySelector('#btn-fiche-rapide').onclick = () => {
                    fermer(false);
                    ouvrirFicheJoueur(joueurId, {
                        matchCourantId: matchActifId,
                        numeroMaillot: actif,
                        codePosteMatch: codePoste
                    });
                };
                boite.querySelector('#btn-fermer-num').onclick = () => fermer(false);
            });
        }

        function placerTitulaire(slotIndex, joueurId, { silencieux = false } = {}) {
            // Si le joueur était déjà sur un autre poste du terrain, on échange les 2 joueurs
            const ancienSlotDuJoueur = trouverSlotDuJoueur(joueurId);
            const joueurActuelSurCible = titulaires[slotIndex];

            if (ancienSlotDuJoueur !== -1 && ancienSlotDuJoueur !== slotIndex) {
                if (joueurActuelSurCible) titulaires[ancienSlotDuJoueur] = joueurActuelSurCible;
                else delete titulaires[ancienSlotDuJoueur];
            } else if (joueurActuelSurCible && joueurActuelSurCible !== joueurId && !remplacants.includes(joueurActuelSurCible)) {
                delete numeros[joueurActuelSurCible];
            }
            // S'il était sur le banc, on l'en retire
            remplacants = remplacants.filter(id => id !== joueurId);
            titulaires[slotIndex] = joueurId;
            if (!silencieux) {
                rafraichirVueTactique();
                sauvegarderCompoAuto();
            }
        }

        function ajouterAuBanc(joueurId) {
            const slot = trouverSlotDuJoueur(joueurId);
            if (slot !== -1) delete titulaires[slot];
            if (!remplacants.includes(joueurId)) remplacants.push(joueurId);
            rafraichirVueTactique();
            sauvegarderCompoAuto();
        }

        function retirerJoueur(joueurId) {
            const slot = trouverSlotDuJoueur(joueurId);
            if (slot !== -1) delete titulaires[slot];
            remplacants = remplacants.filter(id => id !== joueurId);
            delete numeros[joueurId];
            rafraichirVueTactique();
            sauvegarderCompoAuto();
        }

        function rafraichirVueTactique() {
            // 1. Pilules dispositif
            const config = DISPOSITIFS[dispositifActif] || DISPOSITIFS["4-3-3"];
            document.querySelectorAll('#liste-dispositifs [data-disp]').forEach(b =>
                b.classList.toggle('active', b.dataset.disp === dispositifActif)
            );
            document.getElementById('desc-dispositif').textContent = config.description;

            // 2. Terrain de football
            const conteneurTerrain = document.getElementById('conteneur-terrain');
            conteneurTerrain.innerHTML = rendreTerrainHTML({
                dispositif: dispositifActif,
                titulaires,
                numeros,
                joueursMap,
                interactif: true
            });

            // 3. Banc des remplaçants
            document.getElementById('nb-remplacants').textContent = remplacants.length;
            const zoneBanc = document.getElementById('liste-remplacants');
            const rempValides = remplacants.filter(id => joueursMap[id]);
            if (rempValides.length === 0) {
                zoneBanc.innerHTML = `<p class="muted" style="font-size:.85rem; margin:4px 0;">Aucun remplaçant sélectionné. Cliquez sur « ➕ Ajouter un remplaçant ».</p>`;
            } else {
                zoneBanc.innerHTML = rempValides.map(id => {
                    const j = joueursMap[id];
                    const numRemp = obtenirNumeroActuel(id);
                    return `
                        <div class="bench-chip">
                            <button type="button" class="bench-num clickable" data-changer-num="${echapper(id)}" title="Changer le numéro (1-14)">n°${numRemp}</button>
                            <button type="button" data-fiche-id="${echapper(id)}" style="background:none; border:none; padding:0; font:inherit; color:inherit; cursor:pointer; font-weight:inherit;" title="Voir la fiche de ${echapper(j.nomComplet)}">${echapper(j.nomComplet)} <small class="muted">(${echapper(j.poste)})</small></button>
                            <button type="button" class="bench-chip-btn" data-retirer-remp="${echapper(id)}" title="Retirer du banc">✕</button>
                        </div>`;
                }).join('');
            }

            // 4. Liste de l'effectif
            rendreListeEffectif();

            // 5. Barre flottante en bas
            document.getElementById('nb-titulaires-bar').textContent = Object.keys(titulaires).length;
            document.getElementById('nb-remp-bar').textContent = rempValides.length;
        }

        function rendreListeEffectif() {
            const q = document.getElementById('recherche').value.trim().toLowerCase();
            const config = DISPOSITIFS[dispositifActif] || DISPOSITIFS["4-3-3"];

            const joueursTries = [...listeTousLesJoueurs].sort((a, b) => {
                const nbA = compteursApparitions[a.id]?.[equipeActive] || 0;
                const nbB = compteursApparitions[b.id]?.[equipeActive] || 0;
                if (nbB !== nbA) return nbB - nbA;
                return a.nomComplet.localeCompare(b.nomComplet);
            }).filter(j => !q || `${j.nomComplet} ${j.poste}`.toLowerCase().includes(q));

            if (joueursTries.length === 0) {
                document.getElementById('liste-joueurs').innerHTML = `<p class="muted" style="text-align:center;">Aucun joueur trouvé.</p>`;
                return;
            }

            document.getElementById('liste-joueurs').innerHTML = joueursTries.map(j => {
                const slot = trouverSlotDuJoueur(j.id);
                const estRemp = remplacants.includes(j.id);
                const nbMatchs = compteursApparitions[j.id]?.[equipeActive] || 0;
                const numActuel = (slot !== -1 || estRemp) ? obtenirNumeroActuel(j.id) : j.numero;

                let statutBadge = `<span class="tag">${echapper(j.poste)}</span>`;
                if (slot !== -1) {
                    const codePoste = config.postes[slot]?.code || 'Tit.';
                    statutBadge = `<span class="tag" style="background:var(--jaune-doux); color:var(--texte); border-color:var(--jaune);">⚽ Titulaire (${echapper(codePoste)})</span>`;
                } else if (estRemp) {
                    statutBadge = `<span class="tag user">🪑 Remplaçant</span>`;
                }

                const actions = (slot !== -1 || estRemp)
                    ? `<div class="card-actions">
                        <button type="button" class="bench-num clickable" data-changer-num="${echapper(j.id)}" title="Changer le numéro (1-14)">n°${numActuel}</button>
                        <button type="button" class="btn-chip" data-action="retirer" data-id="${j.id}" style="padding:6px 10px; font-size:.78rem; color:var(--rouge);">✕ Retirer</button>
                       </div>`
                    : `<div class="card-actions">
                        <button type="button" class="btn-chip" data-action="auto-titulaire" data-id="${j.id}" style="padding:6px 10px; font-size:.78rem;">+ Terrain</button>
                        <button type="button" class="btn-chip" data-action="banc" data-id="${j.id}" style="padding:6px 10px; font-size:.78rem;">+ Banc</button>
                       </div>`;

                const tagNumHabituel = (slot === -1 && !estRemp && numActuel)
                    ? ` <span class="tag" style="font-size:.7rem; padding:1px 6px;">n°${numActuel}</span>`
                    : '';

                return `
                    <div class="joueur-ligne">
                        <div>
                            <span class="joueur-nom">${echapper(j.nomComplet)}</span>${tagNumHabituel}
                            ${nbMatchs > 0 ? `<span class="stats-badge">(${nbMatchs} m.)</span>` : ''}
                            <br>${statutBadge}
                        </div>
                        ${actions}
                    </div>`;
            }).join('');
        }

        // Modale de choix d'un joueur quand on clique sur un poste du terrain
        function ouvrirChoixJoueurPourPoste(slotIndex) {
            const config = DISPOSITIFS[dispositifActif] || DISPOSITIFS["4-3-3"];
            const poste = config.postes[slotIndex];
            const joueurActuelId = titulaires[slotIndex];
            const joueurActuel = joueurActuelId ? joueursMap[joueurActuelId] : null;
            let numChoisi = joueurActuelId ? obtenirNumeroActuel(joueurActuelId) : (poste.num || (slotIndex + 1));
            let numModifieManuellement = false;

            ouvrirModal((boite, fermer) => {
                // Tri intelligent : joueurs du poste recommandé en premier, puis non sélectionnés, puis par apparitions
                const trierPourCePoste = (q = '') => {
                    const filtre = q.trim().toLowerCase();
                    return [...listeTousLesJoueurs]
                        .filter(j => j.id !== joueurActuelId && (!filtre || `${j.nomComplet} ${j.poste}`.toLowerCase().includes(filtre)))
                        .sort((a, b) => {
                            const libreA = trouverSlotDuJoueur(a.id) === -1 ? 1 : 0;
                            const libreB = trouverSlotDuJoueur(b.id) === -1 ? 1 : 0;
                            if (libreB !== libreA) return libreB - libreA;
                            const bonPosteA = (a.poste || '').toLowerCase() === poste.categorie.toLowerCase() ? 1 : 0;
                            const bonPosteB = (b.poste || '').toLowerCase() === poste.categorie.toLowerCase() ? 1 : 0;
                            if (bonPosteB !== bonPosteA) return bonPosteB - bonPosteA;
                            return (compteursApparitions[b.id]?.[equipeActive] || 0) - (compteursApparitions[a.id]?.[equipeActive] || 0);
                        });
                };

                const actionsActuel = joueurActuel ? `
                    <div class="account-info-item" style="margin: 10px 0 12px;">
                        <div>
                            <small>Actuellement à ce poste</small>
                            <strong>${echapper(joueurActuel.nomComplet)} <span class="tag" id="badge-actuel-num" style="margin-left:4px;">n°${numChoisi}</span></strong>
                        </div>
                        <div class="card-actions">
                            <button type="button" class="btn-chip" id="btn-fiche-actuel" style="padding:6px 10px; font-size:.78rem;">👁️ Fiche</button>
                            <button type="button" class="btn-chip" id="btn-vers-banc" style="padding:6px 10px; font-size:.78rem;">🪑 Banc</button>
                            <button type="button" class="btn-chip" id="btn-vider-poste" style="padding:6px 10px; font-size:.78rem; color:var(--rouge);">✕ Retirer</button>
                        </div>
                    </div>` : '';

                boite.innerHTML = `
                    <h3 class="modal-title">⚽ ${echapper(poste.label)} (${echapper(poste.code)})</h3>
                    <p class="modal-text">Poste recommandé : <strong>${echapper(poste.categorie)}</strong></p>
                    ${actionsActuel}
                    <div class="num-picker-box">
                        <div class="num-picker-head">
                            <span>👕 Numéro du maillot (1 à 14)</span>
                            <span class="tag" id="badge-num-selectionne" style="margin:0;">n°${numChoisi}</span>
                        </div>
                        <div class="num-picker-grid" id="grille-nums-poste"></div>
                    </div>
                    <div class="search" style="margin: 10px 0;">
                        <input type="search" id="search-modal-joueur" placeholder="Rechercher un joueur…" autocomplete="off">
                    </div>
                    <div id="liste-modal-joueurs" class="cselect-list" style="max-height: 250px; border: 1px solid var(--border); border-radius: 12px; padding: 6px;"></div>
                    <div class="modal-actions">
                        <button type="button" class="btn-modal btn-modal-cancel" id="btn-fermer-slot">Fermer</button>
                    </div>
                `;

                const grilleEl = boite.querySelector('#grille-nums-poste');
                const badgeNumSel = boite.querySelector('#badge-num-selectionne');
                const listeEl = boite.querySelector('#liste-modal-joueurs');
                const inputSearch = boite.querySelector('#search-modal-joueur');

                function majGrilleNums() {
                    grilleEl.innerHTML = construireGrilleNumerosHTML(numChoisi, joueurActuelId || null);
                    badgeNumSel.textContent = `n°${numChoisi}`;
                    const badgeActuel = boite.querySelector('#badge-actuel-num');
                    if (badgeActuel) badgeActuel.textContent = `n°${numChoisi}`;
                }

                function afficherOptions(q = '') {
                    const candidats = trierPourCePoste(q);
                    if (candidats.length === 0) {
                        listeEl.innerHTML = `<div class="cselect-empty">Aucun joueur trouvé</div>`;
                        return;
                    }
                    listeEl.innerHTML = candidats.map(j => {
                        const slotExist = trouverSlotDuJoueur(j.id);
                        const estRemp = remplacants.includes(j.id);
                        const recommande = (j.poste || '').toLowerCase() === poste.categorie.toLowerCase();
                        let badge = `<span class="cselect-badge ${recommande ? 'ok' : ''}">${echapper(j.poste)}</span>`;
                        if (slotExist !== -1) {
                            badge = `<span class="cselect-badge warn">⇄ Échanger (${echapper(config.postes[slotExist].code)})</span>`;
                        } else if (estRemp) {
                            badge = `<span class="cselect-badge">🪑 Sur le banc</span>`;
                        }
                        const numTag = j.numero ? ` · n°${j.numero}` : '';
                        return `
                            <button type="button" class="cselect-option" data-choix-id="${echapper(j.id)}">
                                <span class="avatar" style="width:32px; height:32px; font-size:.76rem;">${echapper(initiales(j.prenom, j.nom))}</span>
                                <span class="cselect-texts">
                                    <span class="cselect-title">${echapper(j.nomComplet)}</span>
                                    <span class="cselect-sub">${echapper(j.poste)}${numTag} · ${compteursApparitions[j.id]?.[equipeActive] || 0} match(s)</span>
                                </span>
                                ${badge}
                            </button>`;
                    }).join('');
                }

                majGrilleNums();
                afficherOptions();

                grilleEl.addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-pick-num]');
                    if (!btn) return;
                    const n = Number(btn.dataset.pickNum);
                    numChoisi = n;
                    numModifieManuellement = true;
                    if (joueurActuelId && titulaires[slotIndex] === joueurActuelId) {
                        attribuerNumero(joueurActuelId, n);
                    }
                    majGrilleNums();
                });

                inputSearch.addEventListener('input', () => afficherOptions(inputSearch.value));

                listeEl.addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-choix-id]');
                    if (!btn) return;
                    const choixId = btn.dataset.choixId;
                    const ancienSlotChoix = trouverSlotDuJoueur(choixId);
                    const etaitSurBanc = remplacants.includes(choixId);
                    const numPrefChoix = joueursMap[choixId]?.numero;

                    placerTitulaire(slotIndex, choixId, { silencieux: true });
                    if (numModifieManuellement) {
                        attribuerNumero(choixId, numChoisi, { silencieux: true });
                    } else if (ancienSlotChoix !== -1 || etaitSurBanc) {
                        // Conserve le numéro qu'avait déjà le joueur déplacé ou utilise son numéro profil si libre
                        if (!numeros[choixId] && numPrefChoix && !trouverJoueurPortantNumero(numPrefChoix, choixId)) {
                            numeros[choixId] = numPrefChoix;
                        }
                    } else if (numPrefChoix && !trouverJoueurPortantNumero(numPrefChoix, choixId)) {
                        numeros[choixId] = numPrefChoix;
                    } else {
                        attribuerNumero(choixId, numChoisi, { silencieux: true });
                    }

                    rafraichirVueTactique();
                    sauvegarderCompoAuto();
                    fermer(true);
                });

                boite.querySelector('#btn-fermer-slot').onclick = () => fermer(false);
                if (joueurActuel) {
                    boite.querySelector('#btn-fiche-actuel').onclick = () => {
                        fermer(false);
                        ouvrirFicheJoueur(joueurActuelId, {
                            matchCourantId: matchActifId,
                            numeroMaillot: obtenirNumeroActuel(joueurActuelId),
                            codePosteMatch: poste.code
                        });
                    };
                    boite.querySelector('#btn-vider-poste').onclick = () => {
                        delete titulaires[slotIndex];
                        delete numeros[joueurActuelId];
                        rafraichirVueTactique();
                        sauvegarderCompoAuto();
                        fermer(true);
                    };
                    boite.querySelector('#btn-vers-banc').onclick = () => {
                        ajouterAuBanc(joueurActuelId);
                        fermer(true);
                    };
                }
            });
        }

        // Modale pour ajouter un ou plusieurs remplaçants
        document.getElementById('btn-ajouter-remplacant').addEventListener('click', () => {
            ouvrirModal((boite, fermer) => {
                boite.innerHTML = `
                    <h3 class="modal-title">🪑 Ajouter des remplaçants</h3>
                    <p class="modal-text">Touchez les joueurs à placer sur le banc des remplaçants.</p>
                    <div class="search" style="margin: 10px 0;">
                        <input type="search" id="search-modal-banc" placeholder="Rechercher un joueur…" autocomplete="off">
                    </div>
                    <div id="liste-modal-banc" class="cselect-list" style="max-height: 290px; border: 1px solid var(--border); border-radius: 12px; padding: 6px;"></div>
                    <div class="modal-actions">
                        <button type="button" class="btn-modal btn-modal-ok" id="btn-fermer-banc">Terminé</button>
                    </div>
                `;

                const listeEl = boite.querySelector('#liste-modal-banc');
                const inputSearch = boite.querySelector('#search-modal-banc');

                function afficherCandidats(q = '') {
                    const filtre = q.trim().toLowerCase();
                    const candidats = listeTousLesJoueurs.filter(j =>
                        trouverSlotDuJoueur(j.id) === -1 &&
                        (!filtre || `${j.nomComplet} ${j.poste}`.toLowerCase().includes(filtre))
                    );
                    if (candidats.length === 0) {
                        listeEl.innerHTML = `<div class="cselect-empty">Aucun joueur disponible</div>`;
                        return;
                    }
                    listeEl.innerHTML = candidats.map(j => {
                        const actif = remplacants.includes(j.id);
                        const numTxt = actif ? ` · n°${obtenirNumeroActuel(j.id)}` : (j.numero ? ` · n°${j.numero}` : '');
                        return `
                            <button type="button" class="cselect-option${actif ? ' active' : ''}" data-remp-id="${echapper(j.id)}">
                                <span class="avatar" style="width:32px; height:32px; font-size:.76rem;">${echapper(initiales(j.prenom, j.nom))}</span>
                                <span class="cselect-texts">
                                    <span class="cselect-title">${echapper(j.nomComplet)}</span>
                                    <span class="cselect-sub">${echapper(j.poste)}${numTxt}</span>
                                </span>
                                <span class="cselect-check">✓</span>
                            </button>`;
                    }).join('');
                }

                afficherCandidats();
                inputSearch.addEventListener('input', () => afficherCandidats(inputSearch.value));

                listeEl.addEventListener('click', (e) => {
                    const btn = e.target.closest('[data-remp-id]');
                    if (!btn) return;
                    const id = btn.dataset.rempId;
                    if (remplacants.includes(id)) {
                        remplacants = remplacants.filter(x => x !== id);
                        delete numeros[id];
                    } else {
                        remplacants.push(id);
                    }
                    afficherCandidats(inputSearch.value);
                    rafraichirVueTactique();
                    sauvegarderCompoAuto();
                });

                boite.querySelector('#btn-fermer-banc').onclick = () => fermer(true);
            });
        });

        // Clic ou Glisser-Déposer sur un poste du terrain
        let slotDragSource = null;
        const conteneurTerrain = document.getElementById('conteneur-terrain');

        conteneurTerrain.addEventListener('click', (e) => {
            const node = e.target.closest('.pitch-node');
            if (!node) return;
            ouvrirChoixJoueurPourPoste(parseInt(node.dataset.slot));
        });

        conteneurTerrain.addEventListener('dragstart', (e) => {
            const node = e.target.closest('.pitch-node.filled');
            if (!node) return;
            slotDragSource = parseInt(node.dataset.slot);
        });
        conteneurTerrain.addEventListener('dragover', (e) => {
            if (e.target.closest('.pitch-node')) e.preventDefault();
        });
        conteneurTerrain.addEventListener('drop', (e) => {
            const cible = e.target.closest('.pitch-node');
            if (!cible || slotDragSource === null) return;
            e.preventDefault();
            const slotCible = parseInt(cible.dataset.slot);
            const idSource = titulaires[slotDragSource];
            if (idSource && slotCible !== slotDragSource) {
                placerTitulaire(slotCible, idSource);
            }
            slotDragSource = null;
        });

        // Banc des remplaçants : changer le numéro (1-14), voir fiche ou retirer
        document.getElementById('liste-remplacants').addEventListener('click', (e) => {
            const btnNum = e.target.closest('[data-changer-num]');
            if (btnNum) {
                ouvrirChoixNumeroJoueur(btnNum.dataset.changerNum);
                return;
            }
            const btnFiche = e.target.closest('[data-fiche-id]');
            if (btnFiche) {
                const jId = btnFiche.dataset.ficheId;
                ouvrirFicheJoueur(jId, {
                    matchCourantId: matchActifId,
                    numeroMaillot: obtenirNumeroActuel(jId),
                    codePosteMatch: 'Remp.'
                });
                return;
            }
            const btnRetirer = e.target.closest('[data-retirer-remp]');
            if (btnRetirer) {
                retirerJoueur(btnRetirer.dataset.retirerRemp);
            }
        });

        // Actions rapides depuis la liste de l'effectif en bas
        document.getElementById('liste-joueurs').addEventListener('click', (e) => {
            const btnNum = e.target.closest('[data-changer-num]');
            if (btnNum) {
                ouvrirChoixNumeroJoueur(btnNum.dataset.changerNum);
                return;
            }
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const id = btn.dataset.id;
            const action = btn.dataset.action;

            if (action === 'retirer') {
                retirerJoueur(id);
            } else if (action === 'banc') {
                ajouterAuBanc(id);
            } else if (action === 'auto-titulaire') {
                const config = DISPOSITIFS[dispositifActif] || DISPOSITIFS["4-3-3"];
                const joueur = joueursMap[id];
                // Cherche d'abord un poste libre correspondant à sa catégorie, sinon n'importe quel poste libre
                let slotLibre = config.postes.findIndex((p, idx) => !titulaires[idx] && p.categorie.toLowerCase() === (joueur?.poste || '').toLowerCase());
                if (slotLibre === -1) slotLibre = config.postes.findIndex((_, idx) => !titulaires[idx]);

                if (slotLibre === -1) {
                    toast("Les 11 postes titulaires sont déjà occupés ! Touchez un poste sur le terrain pour remplacer un joueur, ou ajoutez-le au banc.", 'info', 4500);
                    return;
                }
                placerTitulaire(slotLibre, id);
            }
        });

        document.getElementById('recherche').addEventListener('input', rendreListeEffectif);

        document.getElementById('btn-vider-compo').addEventListener('click', async () => {
            const ok = await confirmer("Voulez-vous vraiment vider tous les titulaires et remplaçants de ce match ?", {
                titre: 'Vider le terrain ?', ok: 'Vider la compo', danger: true
            });
            if (!ok) return;
            titulaires = {};
            remplacants = [];
            numeros = {};
            rafraichirVueTactique();
            await sauvegarderCompoAuto();
            toast("Composition vidée.");
        });

        function planifierSlotsTitulaires(lignesTit, selections, config) {
            const slotParLigne = new Array(lignesTit.length).fill(-1);
            const slotsReserves = new Set();

            // Passe 1 : priorité au numéro de maillot correspondant au numéro par défaut du poste (1..11)
            lignesTit.forEach((item, idx) => {
                if (selections[idx] === '__IGNORE__') return;
                if (item.numero >= 1 && item.numero <= 11) {
                    const s = config.postes.findIndex((p, pIdx) => p.num === item.numero && !slotsReserves.has(pIdx));
                    if (s !== -1) {
                        slotParLigne[idx] = s;
                        slotsReserves.add(s);
                    }
                }
            });

            // Passe 2 : catégorie de poste du joueur existant, puis premier slot libre
            lignesTit.forEach((item, idx) => {
                if (selections[idx] === '__IGNORE__' || slotParLigne[idx] !== -1) return;
                const sel = selections[idx];
                const posteJoueur = sel !== '__CREATE__' ? (joueursMap[sel]?.poste || '') : '';
                let s = posteJoueur
                    ? config.postes.findIndex((p, pIdx) => !slotsReserves.has(pIdx) && p.categorie.toLowerCase() === posteJoueur.toLowerCase())
                    : -1;
                if (s === -1) s = config.postes.findIndex((_, pIdx) => !slotsReserves.has(pIdx));
                if (s !== -1) {
                    slotParLigne[idx] = s;
                    slotsReserves.add(s);
                }
            });

            return slotParLigne;
        }

        function construireOptionsSelectFFF(item, matchRes, joueursTries) {
            const { statut, candidatId, candidats } = matchRes;
            const { prenom, nom } = formaterNomPrenomFFF(item.nom);
            const nomCree = `${prenom}${nom ? ' ' + nom : ''}`.trim() || item.nom;
            const idsAmbigus = new Set((candidats || []).map(c => c.id));

            const optCreer = `<option value="__CREATE__"${statut === 'nouveau' ? ' selected' : ''}>➕ Créer « ${echapper(nomCree)} »</option>`;
            const optIgnorer = `<option value="__IGNORE__"${statut === 'anonyme' ? ' selected' : ''}>— Ignorer cette ligne</option>`;

            if (statut === 'ambigu' && candidats.length > 0) {
                const ambigusHtml = candidats.map((c, i) =>
                    `<option value="${echapper(c.id)}"${i === 0 ? ' selected' : ''}>${echapper(c.nomComplet)} (${echapper(c.poste)})</option>`
                ).join('');
                const autresHtml = joueursTries
                    .filter(j => !idsAmbigus.has(j.id))
                    .map(j => `<option value="${echapper(j.id)}">${echapper(j.nomComplet)} (${echapper(j.poste)})</option>`)
                    .join('');
                return `
                    <optgroup label="Correspondances possibles">${ambigusHtml}</optgroup>
                    <optgroup label="Autres joueurs">${autresHtml}${optCreer}${optIgnorer}</optgroup>
                `;
            }

            const preselectId = (statut === 'exact' || statut === 'probable') ? candidatId : null;
            const joueursHtml = joueursTries.map(j =>
                `<option value="${echapper(j.id)}"${preselectId === j.id ? ' selected' : ''}>${echapper(j.nomComplet)} (${echapper(j.poste)})</option>`
            ).join('');
            return `${optCreer}${optIgnorer}${joueursHtml}`;
        }

        // Saisir manuellement ou importer une feuille de match FFF / liste avec suggestions intelligentes
        document.getElementById('btn-importer-noms').addEventListener('click', () => {
            if (!matchActifId) {
                toast("Sélectionnez d'abord un match.", 'info');
                return;
            }
            const config = DISPOSITIFS[dispositifActif] || DISPOSITIFS["4-3-3"];
            let texteMemorise = '';

            // Copie locale de travail pour la saisie manuelle assistée
            let slotsTit = { ...titulaires };
            let slotsRemp = [ ...remplacants ];
            let slotsNum = { ...numeros };

            function trouverPremierSlotLibre() {
                for (let i = 0; i < 11; i++) {
                    if (!slotsTit[i]) return i;
                }
                for (let i = 0; i < 3; i++) {
                    if (!slotsRemp[i]) return 11 + i;
                }
                return 0;
            }

            let slotCible = trouverPremierSlotLibre();
            let ongletActif = 'saisie'; // 'saisie' ou 'coller'

            function obtenirInfosSlot(idx) {
                if (idx < 11) {
                    const p = config.postes[idx] || { num: idx + 1, code: 'Tit.', categorie: 'Milieu', label: `Poste ${idx + 1}` };
                    return { idx, numero: p.num, label: p.label, code: p.code, categorie: p.categorie, role: 'titulaire' };
                }
                const rempIdx = idx - 11;
                return { idx, numero: 12 + rempIdx, label: `Remplaçant ${rempIdx + 1}`, code: 'Remp.', categorie: 'Remplaçant', role: 'remplacant' };
            }

            ouvrirModal((boite, fermer) => {
                boite.classList.add('modal-wide');
                let rafraichirSlots = () => {};

                function afficherEtape1() {
                    const nbTitActuels = Object.keys(slotsTit).length;
                    const nbRempActuels = slotsRemp.filter(Boolean).length;
                    const totalRemplis = nbTitActuels + nbRempActuels;

                    boite.innerHTML = `
                        <h3 class="modal-title">⚡ Composer l'équipe (${echapper(dispositifActif)})</h3>
                        <div class="saisie-tabs">
                            <button type="button" class="saisie-tab-btn ${ongletActif === 'saisie' ? 'active' : ''}" id="tab-btn-saisie">
                                ✍️ Saisie manuelle assistée
                            </button>
                            <button type="button" class="saisie-tab-btn ${ongletActif === 'coller' ? 'active' : ''}" id="tab-btn-coller">
                                📋 Copier-coller FFF / Texte
                            </button>

                        <!-- VUE 1 : SAISIE ASSISTÉE AVEC SUGGESTIONS EN TEMPS RÉEL -->
                        <div id="vue-saisie-assistee" class="${ongletActif === 'saisie' ? '' : 'hidden'}">

                                    <label style="margin:0; font-size:.84rem; font-weight:700;" id="label-cible-slot">
