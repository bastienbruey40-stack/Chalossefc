<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0d">
    <title>Connexion - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <img src="chalosse.webp" alt="Logo FC Chalosse" class="auth-logo">
        <h1>Connexion</h1>
        <p class="muted">Accédez à votre espace joueur / admin.</p>

        <form id="form-connexion">
            <label for="in-email">Adresse email</label>
            <input type="email" id="in-email" placeholder="vous@exemple.fr" autocomplete="email" required>
            <label for="in-password">Mot de passe</label>
            <input type="password" id="in-password" placeholder="••••••••" autocomplete="current-password" required>
            <button class="btn" type="submit" id="btn-connecter">Se connecter</button>
        </form>

        <a href="inscription.html" class="lien">Pas encore de compte ? <strong>S'inscrire</strong></a>
    </div>

    <script type="module">
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth } from "./js/firebase.js";
        import { toast, chargement, afficherFlash } from "./js/ui.js";

        afficherFlash();

        document.getElementById('form-connexion').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('in-email').value.trim();
            const password = document.getElementById('in-password').value;
            if (!email || !password) return toast("Veuillez remplir tous les champs.", 'error');

            const bouton = document.getElementById('btn-connecter');
            chargement(bouton, true, 'Connexion…');
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "index.html";
            } catch (error) {
                console.error("Erreur de connexion:", error);
                if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found'].includes(error.code)) {
                    toast("Email ou mot de passe incorrect.", 'error');
                } else if (error.code === 'auth/invalid-email') {
                    toast("L'adresse email n'est pas valide.", 'error');
                } else {
                    toast("Erreur lors de la connexion : " + error.message, 'error');
                }
                chargement(bouton, false);
            }
        });
    </script>
</body>
</html>
