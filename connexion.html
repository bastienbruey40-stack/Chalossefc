<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0d">
    <title>Connexion - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <img src="chalosse.webp" alt="Logo FC Chalosse" class="auth-logo">
        <h1>Connexion</h1>
        <p class="muted">Accédez à votre espace joueur / admin.</p>

        <form id="form-connexion">
            <label for="in-email">Adresse email</label>
            <input type="email" id="in-email" placeholder="vous@exemple.fr" autocomplete="email" required>

            <label for="in-password">Mot de passe</label>
            <div class="pw-wrap">
                <input type="password" id="in-password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" id="btn-toggle-pw" title="Afficher le mot de passe" aria-label="Afficher le mot de passe">👁️</button>
            </div>

            <div class="auth-links-row">
                <button type="button" class="btn-link" id="btn-mdp-oublie">Mot de passe oublié ?</button>
            </div>

            <button class="btn" type="submit" id="btn-connecter">Se connecter</button>
        </form>

        <a href="inscription.html" class="lien">Pas encore de compte ? <strong>S'inscrire</strong></a>
    </div>

    <script type="module">
        import {
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            deleteUser
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { auth, db } from "./js/firebase.js";
        import { toast, flash, formulaire, chargement, afficherFlash } from "./js/ui.js";

        auth.languageCode = 'fr';
        afficherFlash();

        // Afficher / masquer le mot de passe
        const inPw = document.getElementById('in-password');
        document.getElementById('btn-toggle-pw').addEventListener('click', () => {
            inPw.type = inPw.type === 'text' ? 'password' : 'text';
        });

        // Connexion Email + Mot de passe
        document.getElementById('form-connexion').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('in-email').value.trim();
            const password = inPw.value;
            if (!email || !password) return toast("Veuillez remplir tous les champs.", 'error');

            const bouton = document.getElementById('btn-connecter');
            chargement(bouton, true, 'Connexion…');
            try {
                const { user } = await signInWithEmailAndPassword(auth, email, password);

                // Vérifie si la fiche utilisateur existe dans Firestore
                const snap = await getDoc(doc(db, "utilisateurs", user.uid));
                const profil = snap.exists() ? snap.data() : null;

                if (!profil) {
                    // Ce compte a été supprimé par l'administrateur dans Firestore !
                    // 1) Si une recréation était en attente après un reset de mot de passe :
                    let attenteRecreation = null;
                    try {
                        const raw = localStorage.getItem('chalosse_recreation_profil');
                        if (raw) {
                            const p = JSON.parse(raw);
                            if (p.email?.toLowerCase() === email.toLowerCase()) attenteRecreation = p;
                        }
                    } catch (_) {}

                    if (attenteRecreation) {
                        localStorage.removeItem('chalosse_recreation_profil');
                        await setDoc(doc(db, "utilisateurs", user.uid), {
                            prenom: attenteRecreation.prenom,
                            nom: attenteRecreation.nom,
                            email: email,
                            role: "utilisateur",
                            attente_confirmation_mail: false
                        });
                        flash("Votre nouveau compte a été créé avec succès !");
                        window.location.href = "index.html";
                        return;
                    }

                    // 2) Sinon, on purge automatiquement l'utilisateur de Firebase Auth pour libérer l'adresse e-mail !
                    await deleteUser(user).catch(() => {});
                    toast("Ce compte avait été supprimé par un administrateur. Votre adresse e-mail est maintenant libérée : vous pouvez vous réinscrire !", 'info', 6500);
                    chargement(bouton, false);
                    return;
                }

                if (profil.attente_confirmation_mail && !user.emailVerified) {
                    window.location.href = "inscription.html?attente=1";
                    return;
                }
                if (profil.attente_confirmation_mail && user.emailVerified) {
                    await updateDoc(doc(db, "utilisateurs", user.uid), { attente_confirmation_mail: false }).catch(() => {});
                }

                window.location.href = "index.html";
            } catch (error) {
                console.error("Erreur de connexion:", error);
                if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found'].includes(error.code)) {
                    toast("Email ou mot de passe incorrect.", 'error');
                } else if (error.code === 'auth/invalid-email') {
                    toast("L'adresse email n'est pas valide.", 'error');
                } else if (error.code === 'auth/too-many-requests') {
                    toast("Trop de tentatives. Réessayez plus tard ou réinitialisez votre mot de passe.", 'error');
                } else {
                    toast("Erreur lors de la connexion : " + error.message, 'error');
                }
                chargement(bouton, false);
            }
        });

        // Mot de passe oublié -> envoi d'un email de réinitialisation avec retour vers l'application
        document.getElementById('btn-mdp-oublie').addEventListener('click', async () => {
            const emailActuel = document.getElementById('in-email').value.trim();
            const res = await formulaire({
                titre: 'Mot de passe oublié ?',
                texte: 'Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.',
                ok: 'Envoyer le mail',
                champs: [
                    { nom: 'email', label: 'Adresse e-mail du compte', type: 'email', valeur: emailActuel, placeholder: 'vous@exemple.fr' }
                ]
            });
            if (!res || !res.email.trim()) return;
            try {
                await sendPasswordResetEmail(auth, res.email.trim());
                toast(`E-mail envoyé à ${res.email.trim()} (vérifiez aussi vos spams) !`, 'success', 5500);
            } catch (err) {
                console.error(err);
                toast("Impossible d'envoyer l'e-mail : vérifiez l'adresse saisie.", 'error');
            }
        });
    </script>
</body>
</html>
