<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0d">
    <title>Inscription - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <img src="chalosse.webp" alt="Logo FC Chalosse" class="auth-logo">
        <h1>Inscription</h1>
        <p class="muted">Rejoignez l'application du club !</p>

        <form id="form-inscription">
            <div class="form-row">
                <div>
                    <label for="in-prenom">Prénom</label>
                    <input type="text" id="in-prenom" placeholder="Prénom" autocomplete="given-name" required>
                </div>
                <div>
                    <label for="in-nom">Nom</label>
                    <input type="text" id="in-nom" placeholder="Nom de famille" autocomplete="family-name" required>
                </div>
            </div>
            <label for="in-email">Adresse email</label>
            <input type="email" id="in-email" placeholder="vous@exemple.fr" autocomplete="email" required>
            <label for="in-password">Mot de passe</label>
            <input type="password" id="in-password" placeholder="6 caractères minimum" autocomplete="new-password" minlength="6" required>
            <button class="btn" type="submit" id="btn-inscrire">S'inscrire</button>
        </form>

        <a href="connexion.html" class="lien">Déjà un compte ? <strong>Se connecter</strong></a>
    </div>

    <script type="module">
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth } from "./js/firebase.js";
        import { toast, flash, chargement } from "./js/ui.js";

        document.getElementById('form-inscription').addEventListener('submit', async (e) => {
            e.preventDefault();
            const prenom = document.getElementById('in-prenom').value.trim();
            const nom = document.getElementById('in-nom').value.trim();
            const email = document.getElementById('in-email').value.trim();
            const password = document.getElementById('in-password').value;

            if (!prenom || !nom || !email || !password) return toast("Veuillez remplir tous les champs.", 'error');

            const bouton = document.getElementById('btn-inscrire');
            chargement(bouton, true, 'Création du compte…');
            try {
                // 1. Création du compte (email / mot de passe)
                const { user } = await createUserWithEmailAndPassword(auth, email, password);

                // 2. Fiche utilisateur dans Firestore
                await setDoc(doc(db, "utilisateurs", user.uid), {
                    prenom: prenom,
                    nom: nom,
                    email: email,
                    role: "utilisateur" // Par défaut, tout nouveau compte est un simple utilisateur
                });

                flash("Compte créé avec succès ! Bienvenue au FC Chalosse.");
                window.location.href = "index.html";
            } catch (error) {
                console.error("Erreur d'inscription:", error);
                if (error.code === 'auth/email-already-in-use') toast("Cette adresse email est déjà utilisée.", 'error');
                else if (error.code === 'auth/weak-password') toast("Le mot de passe doit faire au moins 6 caractères.", 'error');
                else if (error.code === 'auth/invalid-email') toast("L'adresse email n'est pas valide.", 'error');
                else toast("Erreur lors de l'inscription : " + error.message, 'error');
                chargement(bouton, false);
            }
        });
    </script>
</body>
</html>
