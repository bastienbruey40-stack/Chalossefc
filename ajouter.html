<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Ajouter un joueur - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container narrow">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Nouveau joueur</h1>
            <p>Ajoutez un joueur à l'effectif (il apparaîtra dans les compos et les stats).</p>
        </header>

        <form class="card" id="form-joueur">
            <div class="form-row">
                <div>
                    <label for="prenom" style="margin-top:0">Prénom</label>
                    <input type="text" id="prenom" placeholder="Ex : Bastien" autocomplete="off" required>
                </div>
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" placeholder="Ex : Dupont" autocomplete="off" required>
                </div>
            </div>

            <label>Poste sur le terrain</label>
            <div class="choice-grid cols-4" id="choix-poste">
                <button type="button" class="choice-card" data-poste="Gardien">
                    <span class="choice-ic">🧤</span>
                    <span>Gardien</span>
                </button>
                <button type="button" class="choice-card" data-poste="Défenseur">
                    <span class="choice-ic">🛡️</span>
                    <span>Défenseur</span>
                </button>
                <button type="button" class="choice-card active" data-poste="Milieu">
                    <span class="choice-ic">⚙️</span>
                    <span>Milieu</span>
                </button>
                <button type="button" class="choice-card" data-poste="Attaquant">
                    <span class="choice-ic">⚡</span>
                    <span>Attaquant</span>
                </button>
            </div>

            <div class="num-picker-box" style="margin-top: 16px;">
                <div class="num-picker-head">
                    <span>👕 Numéro de maillot habituel (optionnel, 1 à 14)</span>
                    <button type="button" class="num-pill-auto active" id="btn-num-auto">Auto</button>
                </div>
                <div class="num-picker-grid" id="grille-num-joueur"></div>
            </div>

            <button class="btn" type="submit" id="btn-creer">Ajouter le joueur</button>
            <a href="effectif.html" class="btn-retour">Voir l'effectif</a>
        </form>
    </main>

    <script type="module">
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil } from "./js/firebase.js";
        import { toast, flash, chargement } from "./js/ui.js";

        let posteChoisi = 'Milieu';
        let numeroChoisi = null;

        const grilleNums = document.getElementById('grille-num-joueur');
        const btnNumAuto = document.getElementById('btn-num-auto');
        grilleNums.innerHTML = Array.from({ length: 14 }, (_, i) => i + 1)
            .map(n => `<button type="button" class="num-pill" data-num="${n}">${n}</button>`)
            .join('');

        function majSelectionNum() {
            btnNumAuto.classList.toggle('active', numeroChoisi === null);
            grilleNums.querySelectorAll('[data-num]').forEach(b =>
                b.classList.toggle('active', Number(b.dataset.num) === numeroChoisi)
            );
        }

        btnNumAuto.addEventListener('click', () => {
            numeroChoisi = null;
            majSelectionNum();
        });
        grilleNums.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-num]');
            if (!btn) return;
            const n = Number(btn.dataset.num);
            numeroChoisi = (numeroChoisi === n) ? null : n;
            majSelectionNum();
        });

        document.querySelectorAll('#choix-poste [data-poste]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#choix-poste [data-poste]').forEach(b => b.classList.toggle('active', b === btn));
                posteChoisi = btn.dataset.poste;
            });
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }
            const profil = await chargerProfil(user.uid).catch(() => null);
            if (profil?.role !== "admin") {
                flash("Accès réservé aux administrateurs.", 'error');
                window.location.href = "index.html";
            }
        });

        document.getElementById('form-joueur').addEventListener('submit', async (e) => {
            e.preventDefault();
            const prenom = document.getElementById('prenom').value.trim();
            const nom = document.getElementById('nom').value.trim();
            if (!prenom || !nom) return toast("Renseignez le prénom et le nom.", 'error');

            const bouton = document.getElementById('btn-creer');
            chargement(bouton, true);
            try {
                const payload = {
                    prenom: prenom,
                    nom: nom,
                    poste: posteChoisi,
                    role: "joueur"
                };
                if (numeroChoisi !== null) payload.numero = numeroChoisi;
                await addDoc(collection(db, "utilisateurs"), payload);
                flash(`${prenom} ${nom} (${posteChoisi}${numeroChoisi ? ` · n°${numeroChoisi}` : ''}) a rejoint l'effectif !`);
                window.location.href = "effectif.html";
            } catch (err) {
                toast("Opération bloquée : " + err.message, 'error', 6000);
                chargement(bouton, false);
            }
        });
    </script>
</body>
</html>
