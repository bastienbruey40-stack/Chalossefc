<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Noter un joueur - FC Chalosse</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="FC Chalosse">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container narrow">
        <header class="page-header">
            <h1 id="nom-joueur">Chargement…</h1>
            <p>Attribuez une note sur 10 (ex : 7,5).</p>
        </header>

        <form class="card" id="form-note">
            <div id="message-deja-note" class="info-admin"></div>
            <input type="number" id="note" inputmode="decimal" min="0" max="10" step="0.5" placeholder="Ex : 6.5"
                   style="font-size:1.8rem; text-align:center; font-weight:800">
            <button class="btn" type="submit" id="btn-valider">Valider la note</button>
            <a href="index.html" class="btn-retour">Annuler</a>
        </form>
    </main>

    <script type="module">
        import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, lireDoc, invaliderCache } from "./js/firebase.js";
        import { toast, flash } from "./js/ui.js";

        const urlParams = new URLSearchParams(window.location.search);
        const joueurId = urlParams.get('id');
        const matchId = urlParams.get('match');
        let utilisateurConnecte = null;

        if (matchId) document.querySelector('.btn-retour').href = `match_detail.html?match=${matchId}`;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                flash("Vous devez être connecté pour voter.", 'error');
                window.location.href = "connexion.html";
                return;
            }
            utilisateurConnecte = user;
            verifierNoteExistante();
        });

        async function chargerJoueur() {
            if (!joueurId) return;
            const res = await lireDoc("utilisateurs", joueurId);
            document.getElementById('nom-joueur').textContent = res
                ? `Noter ${res.data.prenom} ${res.data.nom}` : "Joueur introuvable";
        }
        chargerJoueur();

        // Vérifie si une note existe déjà
        async function verifierNoteExistante() {
            if (!matchId || !joueurId || !utilisateurConnecte) return;
            const snap = await getDoc(doc(db, "notes", `${matchId}_${joueurId}_${utilisateurConnecte.uid}`));
            if (snap.exists()) {
                const notePrecedente = snap.data().note;
                const msg = document.getElementById('message-deja-note');
                msg.style.display = "block";
                msg.textContent = `✅ Vous avez déjà donné ${notePrecedente}/10 à ce joueur. Vous pouvez la modifier ci-dessous.`;
                document.getElementById('note').value = notePrecedente;
                document.getElementById('btn-valider').textContent = "Mettre à jour ma note";
            }
        }

        document.getElementById('form-note').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!utilisateurConnecte) return toast("Vous n'êtes pas connecté.", 'error');
            if (!matchId) return toast("Aucun match n'a été sélectionné.", 'error');

            const valeurNote = parseFloat(document.getElementById('note').value.replace(',', '.'));
            if (isNaN(valeurNote) || valeurNote < 0 || valeurNote > 10) {
                return toast("Merci de rentrer une note comprise entre 0 et 10.", 'error');
            }
            try {
                await setDoc(doc(db, "notes", `${matchId}_${joueurId}_${utilisateurConnecte.uid}`), {
                    joueurId: joueurId,
                    matchId: matchId,
                    voterId: utilisateurConnecte.uid,
                    note: valeurNote,
                    date: new Date().toISOString()
                });
                invaliderCache("notes");
                flash("Note enregistrée !");
                window.location.href = `match_detail.html?match=${matchId}`;
            } catch (err) {
                toast("Erreur lors de l'enregistrement : " + err.message, 'error');
            }
        });
    </script>
</body>
</html>
