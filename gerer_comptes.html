<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Gestion des Comptes - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Comptes utilisateurs</h1>
            <p>Personnes inscrites sur l'application (les joueurs se gèrent dans « Effectif »).</p>
        </header>

        <div class="search">
            <input type="search" id="recherche" placeholder="Rechercher par nom ou email…" autocomplete="off">
        </div>

        <div id="liste-comptes" class="cards-grid">
            <div class="skeleton small"></div><div class="skeleton small"></div>
        </div>
    </main>

    <script type="module">
        import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil } from "./js/firebase.js";
        import { toast, flash, confirmer, echapper, initiales } from "./js/ui.js";

        const conteneur = document.getElementById('liste-comptes');
        let comptes = [];
        let monUid = null;

        // Accès réservé aux admins
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }
            const profil = await chargerProfil(user.uid).catch(() => null);
            if (profil?.role === "admin") {
                monUid = user.uid;
                chargerTousLesComptes();
            } else {
                flash("Accès réservé aux administrateurs.", 'error');
                window.location.href = "index.html";
            }
        });

        async function chargerTousLesComptes() {
            try {
                const snap = await getDocs(collection(db, "utilisateurs"));
                comptes = [];
                snap.forEach(d => {
                    const data = d.data();
                    if (data.role === "joueur") return; // les joueurs (foot) sont gérés dans Effectif
                    comptes.push({ uid: d.id, ...data });
                });
                comptes.sort((a, b) => (a.role === 'admin' ? -1 : 1) - (b.role === 'admin' ? -1 : 1) || (a.prenom || '').localeCompare(b.prenom || ''));
                afficher();
            } catch (error) {
                console.error("Erreur:", error);
                conteneur.innerHTML = `<p class="empty error-text">Erreur lors du chargement.</p>`;
            }
        }

        function afficher() {
            const q = document.getElementById('recherche').value.trim().toLowerCase();
            const liste = comptes.filter(c => `${c.prenom || ''} ${c.nom || ''} ${c.email || ''}`.toLowerCase().includes(q));
            if (liste.length === 0) {
                conteneur.innerHTML = `<p class="empty">Aucun compte utilisateur trouvé.</p>`;
                return;
            }
            conteneur.innerHTML = liste.map(c => {
                const estAdmin = c.role === "admin";
                const action = c.uid !== monUid
                    ? `<button type="button" class="btn-supprimer" data-uid="${c.uid}" title="Supprimer ce compte" aria-label="Supprimer ce compte">🗑️</button>`
                    : `<span class="tag">Moi</span>`;
                return `
                    <div class="player-card">
                        <span class="avatar">${echapper(initiales(c.prenom, c.nom))}</span>
                        <div class="info">
                            <strong>${echapper(c.prenom || "Compte")} ${echapper(c.nom || "incomplet")}</strong>
                            ${c.email ? `<span class="sub">✉️ ${echapper(c.email)}</span>` : ''}
                            <span class="tag ${estAdmin ? 'admin' : 'user'}">${estAdmin ? 'Admin' : 'Utilisateur'}</span>
                        </div>
                        ${action}
                    </div>`;
            }).join('');
        }

        document.getElementById('recherche').addEventListener('input', afficher);

        conteneur.addEventListener('click', async (e) => {
            const btn = e.target.closest('.btn-supprimer');
            if (!btn) return;
            const compte = comptes.find(c => c.uid === btn.dataset.uid);
            const ok = await confirmer(`Le compte de ${compte?.prenom || 'cet utilisateur'} sera supprimé de l'application.`, {
                titre: 'Supprimer ce compte ?', ok: 'Supprimer', danger: true
            });
            if (!ok) return;
            try {
                await deleteDoc(doc(db, "utilisateurs", btn.dataset.uid));
                toast("Le compte a été supprimé.");
                chargerTousLesComptes();
            } catch (error) {
                toast("Erreur lors de la suppression : " + error.message, 'error');
            }
        });
    </script>
</body>
</html>
