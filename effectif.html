<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Effectif - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Effectif du club</h1>
            <p id="resume-effectif">Chargement de l'effectif…</p>
        </header>

        <div class="toolbar-row">
            <div class="search">
                <input type="search" id="recherche" placeholder="Rechercher un joueur ou un poste…" autocomplete="off">
            </div>
            <div class="toolbar-actions hidden" id="outils-admin">
                <button type="button" class="btn-chip" id="btn-mode-select">☑️ Sélection multiple</button>
                <a href="ajouter.html" class="btn-chip primary">➕ Ajouter</a>
            </div>
        </div>

        <div class="onglets" role="tablist" id="filtres-poste">
            <button type="button" class="btn-onglet actif" data-poste="tous">Tous</button>
            <button type="button" class="btn-onglet" data-poste="Gardien">🧤 Gardiens</button>
            <button type="button" class="btn-onglet" data-poste="Défenseur">🛡️ Déf.</button>
            <button type="button" class="btn-onglet" data-poste="Milieu">⚙️ Milieux</button>
            <button type="button" class="btn-onglet" data-poste="Attaquant">⚡ Attaq.</button>
        </div>

        <div id="liste-tous-joueurs" class="cards-grid">
            <div class="skeleton small"></div><div class="skeleton small"></div><div class="skeleton small"></div>
        </div>

        <!-- Barre flottante de suppression groupée -->
        <div class="sticky-actions hidden" id="barre-selection">
            <span class="sticky-info"><strong id="nb-select">0</strong> sélectionné(s)</span>
            <button type="button" class="btn-chip" id="btn-tout-cocher">Tout cocher</button>
            <button type="button" class="btn" id="btn-suppr-lot" style="background:var(--rouge); color:#fff; margin-top:0">🗑️ Supprimer</button>
        </div>
    </main>

    <script type="module">
        import { collection, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil, estProfilJoueur } from "./js/firebase.js";
        import { toast, confirmer, formulaire, chargement, echapper, initiales } from "./js/ui.js";
        import { ouvrirFicheJoueur } from "./js/tactique.js";

        let estAdmin = false;
        let listeJoueurs = [];
        let filtrePoste = 'tous';
        let modeSelection = false;
        const selection = new Set();

        const conteneur = document.getElementById('liste-tous-joueurs');
        const btnModeSelect = document.getElementById('btn-mode-select');
        const barreSelection = document.getElementById('barre-selection');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "connexion.html"; return; }
            const profil = await chargerProfil(user.uid).catch(() => null);
            estAdmin = profil?.role === "admin";
            if (estAdmin) document.getElementById('outils-admin').classList.remove('hidden');
            chargerTousLesJoueurs();
        });

        async function chargerTousLesJoueurs() {
            try {
                const snap = await getDocs(collection(db, "utilisateurs"));
                listeJoueurs = [];
                snap.forEach(d => {
                    const data = d.data();
                    if (estProfilJoueur(data)) listeJoueurs.push({ id: d.id, ...data });
                });
                trierJoueurs();
                majResume();
                afficher();
            } catch (error) {
                console.error("Erreur:", error);
                conteneur.innerHTML = `<p class="empty error-text">Erreur lors du chargement.</p>`;
            }
        }

        function trierJoueurs() {
            listeJoueurs.sort((a, b) => (a.nom || '').localeCompare(b.nom || ''));
        }

        function majResume() {
            document.getElementById('resume-effectif').textContent =
                `${listeJoueurs.length} joueur${listeJoueurs.length > 1 ? 's' : ''} dans l'effectif`;
        }

        function joueursFiltres() {
            const q = document.getElementById('recherche').value.trim().toLowerCase();
            return listeJoueurs.filter(j => {
                const okPoste = filtrePoste === 'tous' || (j.poste || '').toLowerCase() === filtrePoste.toLowerCase();
                const okTexte = !q || `${j.prenom} ${j.nom} ${j.poste || ''}`.toLowerCase().includes(q);
                return okPoste && okTexte;
            });
        }

        function afficher() {
            const filtres = joueursFiltres();
            majBarreSelection(filtres);

            if (filtres.length === 0) {
                conteneur.innerHTML = `<p class="empty">Aucun joueur ne correspond aux critères.</p>`;
                return;
            }

            conteneur.innerHTML = filtres.map(j => {
                const coche = selection.has(j.id);
                const actionsAdmin = !estAdmin ? '' : modeSelection
                    ? `<span class="select-box" aria-hidden="true">✓</span>`
                    : `<div class="card-actions">
                        <button type="button" class="btn-editer" data-id="${j.id}" title="Modifier ce joueur" aria-label="Modifier ce joueur">✏️</button>
                        <button type="button" class="btn-supprimer" data-id="${j.id}" title="Supprimer ce joueur" aria-label="Supprimer ce joueur">🗑️</button>
                       </div>`;

                const tagNumero = (j.numero >= 1 && j.numero <= 14)
                    ? ` <span class="tag" style="background:var(--jaune-doux); color:var(--texte); border-color:var(--jaune);">n°${j.numero}</span>`
                    : '';

                return `
                    <div class="player-card${modeSelection ? ' selectable' : ''}${coche ? ' selected' : ''}" data-card-id="${j.id}" style="cursor:pointer">
                        <span class="avatar">${echapper(initiales(j.prenom, j.nom))}</span>
                        <div class="info">
                            <strong>${echapper(j.prenom)} ${echapper((j.nom || '').toUpperCase())}</strong>
                            <span class="tag">${echapper(j.poste || 'Poste non renseigné')}</span>${tagNumero}
                        </div>
                        ${actionsAdmin}
                    </div>`;
            }).join('');
        }

        function majBarreSelection(filtres = joueursFiltres()) {
            if (!modeSelection) {
                barreSelection.classList.add('hidden');
                return;
            }
            barreSelection.classList.remove('hidden');
            document.getElementById('nb-select').textContent = selection.size;
            const toutEstCoche = filtres.length > 0 && filtres.every(j => selection.has(j.id));
            document.getElementById('btn-tout-cocher').textContent = toutEstCoche ? 'Tout décocher' : 'Tout cocher';
            document.getElementById('btn-suppr-lot').disabled = selection.size === 0;
        }

        // Activer / désactiver le mode sélection multiple
        btnModeSelect.addEventListener('click', () => {
            modeSelection = !modeSelection;
            selection.clear();
            btnModeSelect.classList.toggle('active', modeSelection);
            btnModeSelect.textContent = modeSelection ? '✕ Quitter la sélection' : '☑️ Sélection multiple';
            afficher();
        });

        // Tout cocher / tout décocher parmi les joueurs visibles
        document.getElementById('btn-tout-cocher').addEventListener('click', () => {
            const filtres = joueursFiltres();
            const toutEstCoche = filtres.length > 0 && filtres.every(j => selection.has(j.id));
            filtres.forEach(j => toutEstCoche ? selection.delete(j.id) : selection.add(j.id));
            afficher();
        });

        // Suppression groupée en 1 clic
        document.getElementById('btn-suppr-lot').addEventListener('click', async () => {
            if (selection.size === 0) return;
            const ids = [...selection];
            const ok = await confirmer(
                `Voulez-vous supprimer définitivement les ${ids.length} joueur(s) sélectionné(s) ?`,
                { titre: `Supprimer ${ids.length} joueur(s) ?`, ok: `Supprimer (${ids.length})`, danger: true }
            );
            if (!ok) return;

            const btn = document.getElementById('btn-suppr-lot');
            chargement(btn, true, 'Suppression…');
            try {
                await Promise.all(ids.map(id => {
                    const j = listeJoueurs.find(x => x.id === id);
                    if (j && j.role !== "joueur") {
                        return updateDoc(doc(db, "utilisateurs", id), { est_joueur: false });
                    }
                    return deleteDoc(doc(db, "utilisateurs", id));
                }));
                listeJoueurs = listeJoueurs.filter(j => !selection.has(j.id));
                selection.clear();
                modeSelection = false;
                btnModeSelect.classList.remove('active');
                btnModeSelect.textContent = '☑️ Sélection multiple';
                majResume();
                afficher();
                toast(`${ids.length} joueur(s) supprimé(s).`);
            } catch (error) {
                toast("Erreur lors de la suppression : " + error.message, 'error');
            } finally {
                chargement(btn, false);
            }
        });

        document.getElementById('recherche').addEventListener('input', afficher);

        document.querySelectorAll('#filtres-poste [data-poste]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#filtres-poste [data-poste]').forEach(b => b.classList.toggle('actif', b === btn));
                filtrePoste = btn.dataset.poste;
                afficher();
            });
        });

        conteneur.addEventListener('click', async (e) => {
            // En mode sélection : un clic sur toute la carte coche/décoche le joueur
            if (modeSelection) {
                const carte = e.target.closest('[data-card-id]');
                if (!carte) return;
                const id = carte.dataset.cardId;
                selection.has(id) ? selection.delete(id) : selection.add(id);
                carte.classList.toggle('selected', selection.has(id));
                majBarreSelection();
                return;
            }

            // Édition rapide d'un joueur
            const btnEdit = e.target.closest('.btn-editer');
            if (btnEdit) {
                const joueur = listeJoueurs.find(j => j.id === btnEdit.dataset.id);
                if (!joueur) return;
                const res = await formulaire({
                    titre: 'Modifier le joueur',
                    champs: [
                        { nom: 'prenom', label: 'Prénom', valeur: joueur.prenom || '' },
                        { nom: 'nom', label: 'Nom', valeur: joueur.nom || '' },
                        { nom: 'poste', label: 'Poste (Gardien, Défenseur, Milieu, Attaquant)', valeur: joueur.poste || 'Milieu' },
                        { nom: 'numero', label: 'Numéro de maillot (1 à 14, optionnel)', type: 'number', valeur: joueur.numero || '', placeholder: 'Auto', attrs: { min: 1, max: 14, step: 1 } }
                    ]
                });
                if (!res || !res.prenom.trim() || !res.nom.trim()) return;
                const numBrut = String(res.numero ?? '').trim();
                let numVal = null;
                if (numBrut !== '') {
                    numVal = parseInt(numBrut, 10);
                    if (isNaN(numVal) || numVal < 1 || numVal > 14 || String(numVal) !== numBrut && Number(numBrut) !== numVal) {
                        toast("Le numéro de maillot doit être compris entre 1 et 14.", 'error');
                        return;
                    }
                }
                try {
                    await updateDoc(doc(db, "utilisateurs", joueur.id), {
                        prenom: res.prenom.trim(),
                        nom: res.nom.trim(),
                        poste: res.poste.trim() || 'Milieu',
                        numero: numVal
                    });
                    joueur.prenom = res.prenom.trim();
                    joueur.nom = res.nom.trim();
                    joueur.poste = res.poste.trim() || 'Milieu';
                    joueur.numero = numVal;
                    trierJoueurs();
                    afficher();
                    toast('Joueur mis à jour');
                } catch (err) {
                    toast("Erreur : " + err.message, 'error');
                }
                return;
            }

            // Suppression unitaire immédiate
            const btnSuppr = e.target.closest('.btn-supprimer');
            if (btnSuppr) {
                const joueur = listeJoueurs.find(j => j.id === btnSuppr.dataset.id);
                const nomJoueur = `${joueur?.prenom || ''} ${joueur?.nom || ''}`.trim();
                const estCompteApp = joueur && joueur.role !== "joueur";
                const ok = await confirmer(
                    estCompteApp
                        ? `${nomJoueur} sera retiré de l'effectif sportif (son compte d'accès à l'application sera conservé).`
                        : `${nomJoueur} sera supprimé définitivement du club.`,
                    {
                        titre: estCompteApp ? 'Retirer de l\'effectif ?' : 'Supprimer ce joueur ?',
                        ok: estCompteApp ? 'Retirer' : 'Supprimer',
                        danger: true
                    }
                );
                if (!ok) return;
                try {
                    if (estCompteApp) {
                        await updateDoc(doc(db, "utilisateurs", btnSuppr.dataset.id), { est_joueur: false });
                    } else {
                        await deleteDoc(doc(db, "utilisateurs", btnSuppr.dataset.id));
                    }
                    listeJoueurs = listeJoueurs.filter(j => j.id !== btnSuppr.dataset.id);
                    majResume();
                    afficher();
                    toast(estCompteApp ? `${nomJoueur} a été retiré de l'effectif.` : `${nomJoueur} a été supprimé.`);
                } catch (error) {
                    toast("Erreur lors de la suppression : " + error.message, 'error');
                }
                return;
            }

            // Clic sur la carte joueur -> ouvre la fiche résumé
            const carte = e.target.closest('.player-card[data-card-id]');
            if (carte) {
                ouvrirFicheJoueur(carte.dataset.cardId);
            }
        });
    </script>
</body>
</html>
