<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111214">
    <title>Effectif - FC Chalosse</title>
    <link rel="apple-touch-icon" href="chalosse.webp">
    <link rel="icon" href="chalosse.webp">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/layout.js"></script>
</head>
<body class="app">

    <main class="container">
        <header class="page-header">
            <h1><img src="chalosse.webp" alt="" class="logo-header"> Effectif du club</h1>
            <p id="resume-effectif">Chargement de l'effectif…</p>
        </header>

        <div class="search">
            <input type="search" id="recherche" placeholder="Rechercher un joueur ou un poste…" autocomplete="off">
        </div>

        <div id="liste-tous-joueurs" class="cards-grid">
            <div class="skeleton small"></div><div class="skeleton small"></div><div class="skeleton small"></div>
        </div>
    </main>

    <script type="module">
        import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, auth, chargerProfil } from "./js/firebase.js";
        import { toast, confirmer, echapper, initiales } from "./js/ui.js";

        let estAdmin = false;
        let listeJoueurs = [];
        const conteneur = document.getElementById('liste-tous-joueurs');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const profil = await chargerProfil(user.uid).catch(() => null);
                estAdmin = profil?.role === "admin";
            }
            chargerTousLesJoueurs();
        });

        async function chargerTousLesJoueurs() {
            try {
                const snap = await getDocs(collection(db, "utilisateurs"));
                listeJoueurs = [];
                snap.forEach(d => {
                    const data = d.data();
                    if (data.role === "joueur") listeJoueurs.push({ id: d.id, ...data });
                });
                listeJoueurs.sort((a, b) => (a.nom || '').localeCompare(b.nom || ''));
                document.getElementById('resume-effectif').textContent =
                    `${listeJoueurs.length} joueur${listeJoueurs.length > 1 ? 's' : ''} dans l'effectif`;
                afficher();
            } catch (error) {
                console.error("Erreur:", error);
                conteneur.innerHTML = `<p class="empty error-text">Erreur lors du chargement.</p>`;
            }
        }

        function afficher() {
            const q = document.getElementById('recherche').value.trim().toLowerCase();
            const filtres = listeJoueurs.filter(j =>
                `${j.prenom} ${j.nom} ${j.poste || ''}`.toLowerCase().includes(q));

            if (filtres.length === 0) {
                conteneur.innerHTML = `<p class="empty">${q ? 'Aucun joueur ne correspond à la recherche.' : 'Aucun joueur trouvé dans la base.'}</p>`;
                return;
            }

            conteneur.innerHTML = filtres.map(j => `
                <div class="player-card">
                    <span class="avatar">${echapper(initiales(j.prenom, j.nom))}</span>
                    <div class="info">
                        <strong>${echapper(j.prenom)} ${echapper((j.nom || '').toUpperCase())}</strong>
                        <span class="tag">${echapper(j.poste || 'Poste non renseigné')}</span>
                    </div>
                    ${estAdmin ? `<button type="button" class="btn-supprimer" data-id="${j.id}" title="Supprimer ce joueur" aria-label="Supprimer ce joueur">🗑️</button>` : ''}
                </div>`).join('');
        }

        document.getElementById('recherche').addEventListener('input', afficher);

        conteneur.addEventListener('click', async (e) => {
            const btn = e.target.closest('.btn-supprimer');
            if (!btn) return;
            const joueur = listeJoueurs.find(j => j.id === btn.dataset.id);
            const nomJoueur = `${joueur?.prenom || ''} ${joueur?.nom || ''}`.trim();
            const ok = await confirmer(`${nomJoueur} sera supprimé définitivement du club, ainsi que des statistiques.`, {
                titre: 'Supprimer ce joueur ?', ok: 'Supprimer', danger: true
            });
            if (!ok) return;
            try {
                await deleteDoc(doc(db, "utilisateurs", btn.dataset.id));
                toast(`${nomJoueur} a été supprimé.`);
                chargerTousLesJoueurs();
            } catch (error) {
                toast("Erreur lors de la suppression : " + error.message, 'error');
            }
        });
    </script>
</body>
</html>
